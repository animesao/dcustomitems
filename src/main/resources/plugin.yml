name: DC-CustomItems
version: 2.0.0
main: me.dcplugin.dcustomitems.Main
api-version: '1.21'
description: Custom items plugin with JavaScript scripting engine
author: animesao
commands:
  customitem:
    description: Custom item commands
    usage: /customitem <give|list|reload> [args]
    aliases: [ci, customitems]
permissions:
  customitems.give:
    description: Give custom items
    default: op
  customitems.reload:
    description: Reload scripts
    default: op
  customitems.list:
    description: List custom items
    default: true
