# =====================================================
# DC-CustomItems - Конфигурация Команд
# =====================================================
# Создавайте свои команды прямо в YAML!
# 
# Формат:
#   command_name:
#     description: "Описание"
#     usage: "/command [args]"
#     permission: "right.node"
#     cooldown: 0
#     requires-target: false
#     actions:
#       - "action:params"
#
# Доступные действия:
#   heal:HP - Лечение
#   sethealth:HP - Установить HP
#   effect:TYPE:DURATION:LEVEL - Эффект зелья
#   cleareffects - Очистить эффекты
#   particle:TYPE:COUNT - Частицы
#   sound:TYPE:VOLUME:PITCH - Звук
#   message:text - Сообщение
#   broadcast:text - Глобальное сообщение
#   actionbar:text - ActionBar
#   title:main::sub - Заголовок
#   teleport:x,y,z - Телепортация
#   gamemode:MODE - Режим игры
#   fly:toggle/on/off - Полёт
#   setfood:AMOUNT - Еда
#   xp:AMOUNT - Опыт
#   give:MATERIAL:AMOUNT - Выдать предмет
#   remove:MATERIAL - Удалить предмет
#   cmd:command - Выполнить команду
#   console:command - Консоль команда
#   fire:TICKS - Поджечь
#   log:text - В консоль
#
# Плейсхолдеры:
#   %player% - Имя игрока
#   %health% - Текущее HP
#   %max_health% - Максимальное HP
#   %food% - Еда
#   %level% - Уровень
#   %world% - Мир
#   %x%, %y%, %z% - Координаты
#   %target% - Цель
#   %fly_status% - Статус полёта
#   %gamemode% - Режим игры
# =====================================================

commands:
  # ===== КОМАНДЫ ЛЕЧЕНИЯ =====
  heal:
    description: "Исцелить себя или игрока"
    usage: "/heal [игрок]"
    permission: "dci.command.heal"
    cooldown: 0
    requires-target: false
    actions:
      - "heal:20"
      - "cleareffects"
      - "effect:REGENERATION:5:1"
      - "message:&a❤ Вы исцелены!"
      - "particle:HEART:30"
      - "sound:ENTITY_PLAYER_LEVELUP:1:1.5"
      - "title:&a❤ ИСЦЕЛЕНИЕ!::&7Полное здоровье"

  healall:
    description: "Исцелить всех игроков"
    usage: "/healall"
    permission: "dci.command.healall"
    cooldown: 60
    actions:
      - "console:heal @a"
      - "broadcast:&a&l🏥 Все игроки исцелены!"
      - "sound:ENTITY_PLAYER_LEVELUP:2:1"

  # ===== КОМАНДЫ ТЕЛЕПОРТАЦИИ =====
  tp:
    description: "Телепортироваться к игроку"
    usage: "/tp <игрок>"
    permission: "dci.command.tp"
    cooldown: 5
    requires-target: true
    actions:
      - "teleport:%target_x%,%target_y%,%target_z%"
      - "message:&bВы телепортированы к %target%!"
      - "sound:ENTITY_ENDERMAN_TELEPORT:1:1"
      - "particle:PORTAL:50"

  back:
    description: "Вернуться на место смерти"
    usage: "/back"
    permission: "dci.command.back"
    cooldown: 10
    actions:
      - "message:&7Вы вернулись на место смерти."
      - "sound:ENTITY_ENDERMAN_TELEPORT:1:1"

  # ===== КОМАНДЫ РЕЖИМА ИГРЫ =====
  gmc:
    description: "Креативный режим"
    usage: "/gmc"
    permission: "dci.command.gmc"
    actions:
      - "gamemode:creative"
      - "message:&aКреативный режим включён!"
      - "sound:BLOCK_NOTE_BLOCK_PLING:1:2"

  gms:
    description: "Выживание"
    usage: "/gms"
    permission: "dci.command.gms"
    actions:
      - "gamemode:survival"
      - "message:&aВыживание включено!"
      - "sound:BLOCK_NOTE_BLOCK_PLING:1:1"

  gma:
    description: "Приключение"
    usage: "/gma"
    permission: "dci.command.gma"
    actions:
      - "gamemode:adventure"
      - "message:&aРежим приключения!"
      - "sound:BLOCK_NOTE_BLOCK_PLING:1:1.5"

  gmsp:
    description: "Наблюдатель"
    usage: "/gmsp"
    permission: "dci.command.gmsp"
    actions:
      - "gamemode:spectator"
      - "message:&aРежим наблюдателя!"
      - "sound:BLOCK_NOTE_BLOCK_PLING:1:2.5"

  # ===== КОМАНДЫ ПОЛЁТА =====
  fly:
    description: "Включить/выключить полёт"
    usage: "/fly"
    permission: "dci.command.fly"
    actions:
      - "fly:toggle"
      - "message:&bПолёт: %fly_status%!"
      - "sound:BLOCK_NOTE_BLOCK_PLING:1:1"

  flyon:
    description: "Включить полёт"
    usage: "/flyon"
    permission: "dci.command.fly"
    actions:
      - "fly:true"
      - "message:&aПолёт включён!"
      - "sound:BLOCK_NOTE_BLOCK_PLING:1:2"

  flyoff:
    description: "Выключить полёт"
    usage: "/flyoff"
    permission: "dci.command.fly"
    actions:
      - "fly:false"
      - "message:&cПолёт выключен!"
      - "sound:BLOCK_NOTE_BLOCK_PLING:1:0.5"

  # ===== КОМАНДЫ ПРЕДМЕТОВ =====
  feed:
    description: "Насытить себя"
    usage: "/feed [игрок]"
    permission: "dci.command.feed"
    cooldown: 30
    actions:
      - "setfood:20"
      - "message:&aВы накормлены!"
      - "sound:ENTITY_PLAYER_BURP:1:1"
      - "particle:VILLAGER_HAPPY:20"

  god:
    description: "Бессмертие"
    usage: "/god [секунды]"
    permission: "dci.command.god"
    cooldown: 60
    actions:
      - "effect:DAMAGE_RESISTANCE:600:255"
      - "effect:FIRE_RESISTANCE:600:0"
      - "effect:REGENERATION:600:2"
      - "message:&6Вы бессмертны на 10 минут!"
      - "sound:ENTITY_PLAYER_LEVELUP:1:2"
      - "title:&6&lБЕССМЕРТИЕ!::&7На 10 минут"

  # ===== КОМАНДЫ ИНФОРМАЦИИ =====
  stats:
    description: "Показать статистику"
    usage: "/stats"
    permission: "dci.command.stats"
    actions:
      - "message:&6=== Ваша статистика ==="
      - "message:&7Здоровье: &c%health%/%max_health%"
      - "message:&7Еда: &e%food%"
      - "message:&7Уровень: &a%level%"
      - "message:&7Мир: &b%world%"
      - "message:&7Позиция: &f%x% %y% %z%"
      - "message:&7Режим: &d%gamemode%"
      - "message:&6========================"
      - "sound:BLOCK_NOTE_BLOCK_PLING:1:1"

  who:
    description: "Кто онлайн"
    usage: "/who"
    permission: "dci.command.who"
    actions:
      - "message:&6Онлайн: &e%online%/%max_players%"
      - "cmd:list"

  # ===== КОМАНДЫ АДМИНИСТРАТОРА =====
  clearchat:
    description: "Очистить чат"
    usage: "/clearchat"
    permission: "dci.command.clearchat"
    actions:
      - "console:kill @e[type=minecraft:area_effect_cloud]"
      - "broadcast: "
      - "broadcast: "
      - "broadcast: "
      - "broadcast: "
      - "broadcast: "
      - "broadcast: "
      - "broadcast: "
      - "broadcast: "
      - "broadcast: "
      - "broadcast: "
      - "broadcast:&aЧат очищен!"

  kickall:
    description: "Кикнуть всех (кроме себя)"
    usage: "/kickall [причина]"
    permission: "dci.command.kickall"
    actions:
      - "broadcast:&cВы были кикнуты!"
      - "console:kick @a[r=10000] Сервер перезагружается"

  # ===== КОМАНДЫ С ЭФФЕКТАМИ =====
  rage:
    description: "Режим ярости"
    usage: "/rage"
    permission: "dci.command.rage"
    cooldown: 120
    actions:
      - "effect:STRENGTH:30:2"
      - "effect:SPEED:30:2"
      - "effect:FIRE_RESISTANCE:30:0"
      - "message:&4Вы в ярости!"
      - "particle:FLAME:100"
      - "sound:ENTITY_BLAZE_SHOOT:2:0.5"
      - "title:&4&lЯРОСТЬ!::&cСила и Скорость на 30 сек!"

  invisible:
    description: "Невидимость"
    usage: "/invisible [секунды]"
    permission: "dci.command.invisible"
    cooldown: 60
    actions:
      - "effect:INVISIBILITY:600:0"
      - "message:&7Вы стали невидимыми!"
      - "particle:SMOKE:50"
      - "sound:ENTITY_ENDERMAN_TELEPORT:1:2"

  speed:
    description: "Увеличить скорость"
    usage: "/speed [уровень]"
    permission: "dci.command.speed"
    cooldown: 30
    actions:
      - "effect:SPEED:30:2"
      - "message:&bСкорость aumentada!"
      - "particle:CLOUD:20"
      - "sound:ENTITY_PLAYER_BREATH:1:2"
