# ============================================
# СВИТОК ТЕЛЕПОРТАЦИИ - Телепорт к рандом игроку
# ============================================

teleport-scroll:
  type: CONSUMABLE
  activation-slot: HAND
  placeable: false
  permission: teleport.scroll

  item:
    type: PAPER
    title: '&b[🌀] &fСвиток &bТелепортации'
    glowing: true
    unbreakable: false
    item-model: "teleport_scroll"
    enchantments:
      MENDING: 1
    item-flags:
      - HIDE_ENCHANTS
    amount: 1

  lore:
    - ''
    - ' &3━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Магический свиток телепортации'
    - ' &3━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &b🌀 &fПКМ: Телепортироваться'
    - ' &7Телепортирует к случайному игроку'
    - ''
    - ' &eОсталось использований: &b%uses% &7из &93'
    - ''

  max-uses: 3
  uses-depleted-message: ""
  cooldown-message: ""
  equip-message: ""
  unequip-message: ""

  click-cooldown: 500

  triggers:
    on_click_right:
      - 'command:execute at %player% run tp %player% @a[sort=random,limit=1,distance=1..]'
      - 'particles:PORTAL:100'
      - 'particles:REVERSE_PORTAL:50'
      - 'sound:ENTITY_ENDERMAN_TELEPORT:1:1'

    on_pickup:
      - 'particles:PORTAL:15'

    on_drop:
      - 'particles:SMOKE:5'
