# ============================================
# EXAMPLE: MAGE TELEPORT STAFF
# Demonstrates sequences and teleportations
# ============================================

teleport-mage-staff:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: example.teleport_mage

  item:
    type: BLAZE_ROD
    title: '&d[🌀] &fTeleport &dMage Staff'
    glowing: true
    unbreakable: true
    item-model: "teleport_mage_staff"
    enchantments:
      UNBREAKING: 3
      MENDING: 1

  lore:
    - ''
    - ' &d━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Staff of a master of teleportation'
    - ' &d━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fWhile in main hand:'
    - ' &6┌ &eSpeed &dII'
    - ' &6└ &eInvisibility &dwhile sneaking'
    - ''
    - '&d🌀 &fRight Click: Teleport to cursor!'
    - '&d✨ &fLeft Click: Teleport sequence!'
    - ''

  effects:
    - 'SPEED:2'
    - 'NIGHT_VISION:1'

  click-cooldown: 1500
  cooldown-message: ""

  triggers:
    on_equip:
      # Portal particles
      - 'particles_custom:PORTAL:50:0:1:0:1:1:1'
      - 'particles_custom:REVERSE_PORTAL:30:0:2:0:0.5:0.5:0.5'
      
      # Teleport sound
      - 'sound_sequence:ENTITY_ENDERMAN_TELEPORT:1:1;ENTITY_PLAYER_LEVELUP:0.5:1.5'
      
      # Title
      - 'title:&d🌀 &lMAGE TELEPORT!|&7Space obeys you!:10:40:10'

    on_unequip:
      - 'particles_custom:SMOKE:20:0:1:0:0.5:0.5:0.5'
      - 'sound:ENTITY_ENDERMAN_TELEPORT:0.5:0.8'

    on_click_right:
      # Teleport far forward (where you look)
      - 'lightning_forward:100'
      
      # Teleport particles
      - 'particles_custom:PORTAL:100:0:1:0:2:2:2'
      - 'particles_custom:REVERSE_PORTAL:50:0:2:0:1:1:1'
      
      # Teleport sound
      - 'sound:ENTITY_ENDERMAN_TELEPORT:1:1'
      
      # Title
      - 'title:&d🌀 &lTELEPORT!|&7You have been moved!:10:30:10'

    on_click_left:
      # Teleport sequence (animation)
      - 'teleport_sequence:100:64:200:200;200:64:300:200;300:64:400:200;400:64:500:200;500:64:600'
      
      # Trail particles
      - 'particles_custom:PORTAL:200:0:1:0:3:1:3'
      
      # Sounds with delays
      - 'sound_sequence:ENTITY_ENDERMAN_TELEPORT:0.5:1;ENTITY_ENDERMAN_TELEPORT:0.5:1.2;ENTITY_ENDERMAN_TELEPORT:0.5:1.4;ENTITY_PLAYER_LEVELUP:1:2'
      
      # Titles with delays
      - 'title_sequence:🌀 1/4!:::10:20:10;🌀 2/4!:::10:20:10;🌀 3/4!:::10:20:10;🌀 FINISH!:::10:40:10'

    on_jump:
      # Levitation effect on jump
      - 'effect:LEVITATION:3:1'
      - 'particles_custom:PORTAL:30:0:-0.5:0:0.3:0.1:0.3'

    on_damage_taken:
      # Teleport when taking damage (dodge)
      - 'teleport_relative:~:5:~'
      - 'particles_custom:PORTAL:50:0:1:0:1:1:1'
      - 'sound:ENTITY_ENDERMAN_TELEPORT:1:1.5'

    on_pickup:
      - 'particles_custom:PORTAL:25:0:1:0:0.5:0.5:0.5'
      - 'sound:ENTITY_ENDERMAN_TELEPORT:0.5:1.2'

    on_drop:
      - 'particles_custom:SMOKE:15:0:1:0:0.3:0.3:0.3'
