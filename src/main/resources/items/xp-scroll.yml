# ============================================
# СВИТОК ОПЫТА - Даёт опыт и уровни
# ============================================
# 1 использование, даёт:
# - 500 опыта
# - 5 уровней
# ============================================

xp-scroll:
  type: CONSUMABLE
  activation-slot: HAND
  placeable: false
  permission: scroll.xp

  item:
    type: PAPER
    title: '&a[📜] &fСвиток &aОпыта'
    glowing: true
    unbreakable: false
    item-model: "xp_scroll"
    enchantments:
      MENDING: 1
    item-flags:
      - HIDE_ENCHANTS
    amount: 1

  lore:
    - ''
    - ' &a━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Древний свиток знаний'
    - ' &a━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &a📜 &fПКМ: Прочитать'
    - ' &7Даёт 500 опыта и 5 уровней'
    - ''
    - ' &c⚠ Одноразовый предмет!'
    - ''

  max-uses: 1

  uses-depleted-message: '&a❌ Свиток прочитан! Знания усвоены.'

  activation-message: '&a📜 Свиток прочитан!'

  trigger-actions:
    # При ПКМ - опыт
    - 'on_click_right:exp:500:5'
    - 'on_click_right:remove:PAPER:1'
    - 'on_click_right:particle:EXPLOSION_NORMAL:60'
    - 'on_click_right:particle:ENCHANTMENT_TABLE:40'
    - 'on_click_right:sound:ENTITY_PLAYER_LEVELUP:1:1'
    - 'on_click_right:sound:BLOCK_ENCHANTMENT_TABLE_USE:1:1.2'
    - 'on_click_right:title:&a📜 &fЗНАНИЯ!::&a+500 XP + 5 уровней!:10:40:10'
    - 'on_click_right:message:&a📜 &7Вы получили знания! &a+500 XP + 5 уровней!'
    - 'on_click_right:announce:&a📜 &7%player% &7прочитал Свиток Опыта!'

    # При подборе
    - 'on_pickup:message:&a📜 &7Свиток Опыта подобран!'

    # При выбрасывании
    - 'on_drop:message:&a📜 &7Свиток выброшен.'
