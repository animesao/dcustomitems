# ============================================
# ЗЕЛЬЕ ЗДОРОВЬЯ - Исцеляет и даёт регенерацию
# ============================================

health-potion:
  type: CONSUMABLE
  activation-slot: HAND
  placeable: false
  permission: potion.health

  item:
    type: GLASS_BOTTLE
    title: '&c[❤] &fЗелье &cЗдоровья'
    glowing: true
    unbreakable: false
    item-model: "health_potion"
    amount: 1

  lore:
    - ''
    - ' &c━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Исцеляющее зелье природы'
    - ' &c━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &c❤ &fПКМ: Выпить'
    - ' &7Восстанавливает 10 HP'
    - ' &7Даёт регенерацию на 10 секунд'
    - ''
    - ' &eОсталось глотков: &c%uses% &7из &43'
    - ''

  max-uses: 3
  uses-depleted-message: ""
  cooldown-message: ""
  equip-message: ""
  unequip-message: ""

  click-cooldown: 500

  triggers:
    on_click_right:
      - 'heal:10'
      - 'effect:REGENERATION:10:1'
      - 'particles:HEART:30'
      - 'particles:VILLAGER_HAPPY:20'
      - 'sound:ENTITY_PLAYER_BURP:1:1'

    on_pickup:
      - 'particles:HEART:10'

    on_drop:
      - 'particles:SMOKE:5'
