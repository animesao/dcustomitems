# ============================================
# СТИХИЙНЫЙ ПОСОХ - Посох с разными стихиями
# ============================================

elemental-staff:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: elemental.staff
  max-uses: 200

  item:
    type: END_ROD
    title: '&d[🌀] &fСтихийный &dПосох'
    glowing: true
    unbreakable: true
    custom-model-data: 1006

  lore:
    - ''
    - ' &d━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Посох, подчиняющий'
    - ' &7все стихии'
    - ' &d━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fКогда в основной руке:'
    - ' &6┌ &eСила &dII &7(&6∞&7)'
    - ' &6├ &eСкорость &dII &7(&6∞&7)'
    - ' &6└ &eСопротивление &dI &7(&6∞&7)'
    - ''
    - '&d✦ &fИспользований: &d%uses%'
    - ''

  effects:
    - 'INCREASE_DAMAGE:2'
    - 'SPEED:2'
    - 'DAMAGE_RESISTANCE:1'

  click-cooldown: 1000

  activation-message: '&d🌀 &7Стихийный Посох активирован!'
  deactivation-message: '&d🌀 &7Посох убран.'
  equip-message: '&d🌀 &7Стихии окружают вас!'
  unequip-message: '&d🌀 &7Стихии покидают вас.'
  cooldown-message: '&d⏳ &7Подождите {seconds} сек!'
  uses-depleted-message: '&d💀 &7Посох рассеялся!'

  trigger-actions:
    # --- При экипировке ---
    - 'on_equip:particle:PORTAL:25'
    - 'on_equip:particle:ENCHANTMENT_TABLE:20'
    - 'on_equip:sound:BLOCK_END_PORTAL_SPAWN:1:1'
    - 'on_equip:message:&d🌀 &7Стихии окружают вас!'

    # --- При снятии ---
    - 'on_unequip:particle:CLOUD:10'
    - 'on_unequip:sound:BLOCK_END_PORTAL_SPAWN:0.5:0.8'
    - 'on_unequip:message:&d🌀 &7Стихии покидают вас.'

    # --- При ПКМ (Огонь) ---
    - 'on_click_right:effect:INCREASE_DAMAGE:8:3'
    - 'on_click_right:particle:FLAME:35'
    - 'on_click_right:particle:REDSTONE:20'
    - 'on_click_right:sound:ENTITY_BLAZE_SHOOT:1:1'
    - 'on_click_right:title:&d🔥 &7ОГНЕННАЯ СТИХИЯ!::&cПламя пожирает!:10:40:10'
    - 'on_click_right:message:&d🔥 &7Огненная стихия активирована!'

    # --- При ЛКМ (Лёд) ---
    - 'on_click_left:effect:SPEED:8:3'
    - 'on_click_left:effect:RESISTANCE:8:2'
    - 'on_click_left:particle:SNOWFLAKE:30'
    - 'on_click_left:sound:BLOCK_GLASS_BREAK:1:0.5'
    - 'on_click_left:title:&b❄ &7ЛЕДЯНАЯ СТИХИЯ!::&bМороз сковывает!:10:40:10'
    - 'on_click_left:message:&b❄ &7Ледяная стихия активирована!'

    # --- При убийстве ---
    - 'on_kill:effect:INCREASE_DAMAGE:10:2'
    - 'on_kill:effect:SPEED:10:2'
    - 'on_kill:particle:PORTAL:20'
    - 'on_kill:sound:ENTITY_PLAYER_LEVELUP:1:1.5'
    - 'on_kill:message:&d🌀 &7Стихии поглотили врага!'

    # --- При прыжке (Природа) ---
    - 'on_jump:effect:HASTE:5:2'
    - 'on_jump:effect:REGENERATION:5:1'
    - 'on_jump:particle:VILLAGER_HAPPY:12'
    - 'on_jump:sound:ENTITY_SLIME_SQUISH:0.5:1'
    - 'on_jump:message:&a🌿 &7Стихия природы!'

    # --- При нанесении урона ---
    - 'on_damage_dealt:particle:FLAME:10'
    - 'on_damage_dealt:sound:ENTITY_BLAZE_SHOOT:0.5:2'

    # --- При получении урона ---
    - 'on_damage_taken:effect:DAMAGE_RESISTANCE:5:2'
    - 'on_damage_taken:particle:PORTAL:10'

    # --- При подборе ---
    - 'on_pickup:message:&d🌀 &7Посох подобран!'
    - 'on_pickup:particle:PORTAL:25'

    # --- При выбрасывании ---
    - 'on_drop:message:&d🌀 &7Посох выброшен.'
    - 'on_drop:particle:CLOUD:10'
