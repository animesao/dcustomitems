# ============================================
# СТИХИЙНЫЙ ПОСОХ - Многоэлементное оружие
# ============================================

elemental-staff:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: elemental.staff

  item:
    type: BLAZE_ROD
    title: '&6[🌟] &fСтихийный &6Посох'
    glowing: true
    unbreakable: true
    item-model: "elemental_staff"
    enchantments:
      SHARPNESS: 5
      UNBREAKING: 3
      MENDING: 1

  lore:
    - ''
    - ' &6━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Посох четырёх стихий'
    - ' &6━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fКогда в основной руке:'
    - ' &6┌ &eСила &6III'
    - ' &6└ &eСкорость &6II'
    - ''
    - '&c🔥 &fПКМ: Огненный шар'
    - '&b❄ &fЛКМ: Ледяная буря'
    - ''

  effects:
    - 'INCREASE_DAMAGE:3'
    - 'SPEED:2'

  attributes:
    GENERIC_ATTACK_DAMAGE: 10.0
    GENERIC_ATTACK_SPEED: 1.6

  click-cooldown: 1500
  cooldown-message: ""

  triggers:
    on_equip:
      - 'particles:FLAME:20'
      - 'particles:SNOWFLAKE:20'
      - 'sound:ENTITY_PLAYER_LEVELUP:0.5:1.5'

    on_unequip:
      - 'particles:SMOKE:10'

    on_click_right:
      - 'damage_nearby:15:5'
      - 'effect:STRENGTH:8:2'
      - 'particles:FLAME:50'
      - 'particles:EXPLOSION_LARGE:10'
      - 'sound:ENTITY_GENERIC_EXPLODE:1:1'
      - 'title:&c🔥 &7ОГНЕННЫЙ ШАР!|&cВсе враги горят!:10:30:10'

    on_click_left:
      - 'damage_nearby:12:6'
      - 'effect:SLOWNESS:5:2'
      - 'particles:SNOWFLAKE:60'
      - 'particles:BLOCK_CRACK:30'
      - 'sound:ENTITY_GENERIC_FREEZE:1:1'
      - 'knockback:4'
      - 'title:&b❄ &7ЛЕДЯНАЯ БУРЯ!|&bВсе враги заморожены!:10:30:10'

    on_kill:
      - 'heal:20'
      - 'effect:REGENERATION:10:2'
      - 'particles:HEART:25'
      - 'sound:ENTITY_PLAYER_LEVELUP:1:1.5'

    on_damage_dealt:
      - 'heal:5'
      - 'particles:FLAME:10'

    on_damage_taken:
      - 'effect:RESISTANCE:3:1'
      - 'particles:SMOKE:8'

    on_pickup:
      - 'particles:ENCHANTMENT_TABLE:20'

    on_drop:
      - 'particles:SMOKE:10'
