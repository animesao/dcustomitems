# ============================================
# ТОТЕМ ЗАЩИТЫ - Даёт поглощение и сопротивление
# ============================================

shield-totem:
  type: CONSUMABLE
  activation-slot: HAND
  placeable: false
  permission: totem.shield

  item:
    type: TOTEM_OF_UNDYING
    title: '&9[🛡] &fТотем &9Защиты'
    glowing: true
    unbreakable: false
    item-model: "shield_totem"
    amount: 1

  lore:
    - ''
    - ' &9━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Тотем древней защиты'
    - ' &9━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &9🛡 &fПКМ: Активировать'
    - ' &7Даёт Absorption на 60 секунд'
    - ' &7Даёт Resistance на 30 секунд'
    - ''
    - ' &eОсталось активаций: &9%uses% &7из &44'
    - ''

  max-uses: 4
  uses-depleted-message: ""
  cooldown-message: ""
  equip-message: ""
  unequip-message: ""

  click-cooldown: 500

  triggers:
    on_click_right:
      - 'effect:ABSORPTION:60:2'
      - 'effect:RESISTANCE:30:1'
      - 'particles:TOTEM:80'
      - 'particles:ENCHANTMENT_TABLE:30'
      - 'sound:ITEM_TOTEM_USE:1:1'

    on_pickup:
      - 'particles:TOTEM:15'

    on_drop:
      - 'particles:SMOKE:5'
