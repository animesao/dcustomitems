# ============================================
# XP SCROLL - Grants experience and levels
# ============================================

xp-scroll:
  type: CONSUMABLE
  activation-slot: HAND
  placeable: false
  permission: scroll.xp

  item:
    type: PAPER
    title: '&a[📜] &fScroll &aof Experience'
    glowing: true
    unbreakable: false
    item-model: "xp_scroll"
    enchantments:
      MENDING: 1
    item-flags:
      - HIDE_ENCHANTS
    amount: 1

  lore:
    - ''
    - ' &a━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Ancient scroll of knowledge'
    - ' &a━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &a📜 &fRight Click: Read'
    - ' &7Grants 500 experience and 5 levels'
    - ''
    - ' &c⚠ Single-use item!'
    - ''

  max-uses: 1
  uses-depleted-message: ""
  cooldown-message: ""
  equip-message: ""
  unequip-message: ""

  click-cooldown: 500

  triggers:
    on_click_right:
      - 'exp:500:5'
      - 'particles:EXPLOSION_NORMAL:60'
      - 'particles:ENCHANTMENT_TABLE:40'
      - 'sound:ENTITY_PLAYER_LEVELUP:1:1'

    on_pickup:
      - 'particles:ENCHANTMENT_TABLE:10'

    on_drop:
      - 'particles:SMOKE:5'
