# ============================================
# СВИТОК ОПЫТА - Даёт опыт и уровни
# ============================================

xp-scroll:
  type: CONSUMABLE
  activation-slot: HAND
  placeable: false
  permission: scroll.xp

  item:
    type: PAPER
    title: '&a[📜] &fСвиток &aОпыта'
    glowing: true
    unbreakable: false
    item-model: "xp_scroll"
    enchantments:
      MENDING: 1
    item-flags:
      - HIDE_ENCHANTS
    amount: 1

  lore:
    - ''
    - ' &a━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Древний свиток знаний'
    - ' &a━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &a📜 &fПКМ: Прочитать'
    - ' &7Даёт 500 опыта и 5 уровней'
    - ''
    - ' &c⚠ Одноразовый предмет!'
    - ''

  max-uses: 1
  uses-depleted-message: ""
  cooldown-message: ""
  equip-message: ""
  unequip-message: ""

  click-cooldown: 500

  triggers:
    on_click_right:
      - 'exp:500:5'
      - 'particles:EXPLOSION_NORMAL:60'
      - 'particles:ENCHANTMENT_TABLE:40'
      - 'sound:ENTITY_PLAYER_LEVELUP:1:1'

    on_pickup:
      - 'particles:ENCHANTMENT_TABLE:10'

    on_drop:
      - 'particles:SMOKE:5'
