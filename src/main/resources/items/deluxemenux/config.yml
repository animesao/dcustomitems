# ============================================
# DeluxeMenuX - Advanced Menu System
# ============================================
name: "DeluxeMenuX"
version: "1.0"
author: "DC-CustomItems"

# Основные настройки
settings:
  # Язык сообщений
  language: "ru"
  # Включить звуки
  sounds: true
  # Включить анимации
  animations: true

# Команды модуля
commands:
  - menu
  - deluxemenu
  - kits
  - kit
  - shop

# Права
permissions:
  - deluxemenux.use
  - deluxemenux.admin
  - deluxemenux.kit.start
  - deluxemenux.kit.iron
  - deluxemenux.kit.diamond
  - deluxemenux.shop.diamond
  - deluxemenux.shop.emerald
  - deluxemenux.shop.gold
