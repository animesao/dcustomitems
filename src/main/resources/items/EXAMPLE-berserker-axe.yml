# ============================================
# BERSERKER AXE - Berserk Fury mode
# ============================================

berserker-axe:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: berserker.axe

  item:
    type: NETHERITE_AXE
    title: '&4[💀] &fBerserker &4Axe'
    glowing: true
    unbreakable: true
    item-model: "berserker_axe"
    enchantments:
      SHARPNESS: 8
      UNBREAKING: 3
      SWEEPING_EDGE: 3

  lore:
    - ''
    - ' &4━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Weapon of a berserker'
    - ' &4━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fWhile in main hand:'
    - ' &6┌ &eStrength &4IV'
    - ' &6└ &eSpeed &4II'
    - ''
    - '&4💀 &fRight Click: Berserk fury!'
    - ''

  effects:
    - 'INCREASE_DAMAGE:4'
    - 'SPEED:2'

  attributes:
    GENERIC_ATTACK_DAMAGE: 14.0
    GENERIC_ATTACK_SPEED: 1.2
    GENERIC_MAX_HEALTH: -2.0

  click-cooldown: 2000
  cooldown-message: ""

  triggers:
    on_equip:
      - 'particles:DRAGON_BREATH:30'
      - 'sound:ENTITY_WITHER_AMBIENT:1:1'

    on_unequip:
      - 'particles:SMOKE:10'

    on_click_right:
      - 'effect:STRENGTH:10:3'
      - 'effect:SPEED:10:3'
      - 'damage:10'
      - 'particles:DRAGON_BREATH:60'
      - 'sound:ENTITY_ENDER_DRAGON_GROWL:1:1'
      - 'title:&4💀 &7BERSERK FURY!|&4Strength IV for 10 sec!:10:40:10'

    on_click_left:
      - 'damage_nearby:25:4'
      - 'knockback:5'
      - 'particles:DRAGON_BREATH:50'
      - 'particles:EXPLOSION_HUGE:5'
      - 'sound:ENTITY_ENDER_DRAGON_GROWL:1:1.2'

    on_kill:
      - 'heal:30'
      - 'effect:STRENGTH:8:4'
      - 'effect:SPEED:8:3'
      - 'particles:HEART:30'
      - 'sound:ENTITY_PLAYER_LEVELUP:1:2'

    on_damage_dealt:
      - 'heal:8'
      - 'particles:DRAGON_BREATH:15'

    on_damage_taken:
      - 'effect:STRENGTH:5:2'
      - 'effect:SPEED:5:2'
      - 'particles:DRAGON_BREATH:10'

    on_pickup:
      - 'particles:DRAGON_BREATH:20'

    on_drop:
      - 'particles:SMOKE:10'
