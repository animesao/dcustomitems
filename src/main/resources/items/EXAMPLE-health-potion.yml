# ============================================
# HEALTH POTION - Heals and grants regeneration
# ============================================

health-potion:
  type: CONSUMABLE
  activation-slot: HAND
  placeable: false
  permission: potion.health

  item:
    type: GLASS_BOTTLE
    title: '&c[❤] &fHealth &cPotion'
    glowing: true
    unbreakable: false
    item-model: "health_potion"
    amount: 1

  lore:
    - ''
    - ' &c━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Healing potion of nature'
    - ' &c━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &c❤ &fRight Click: Drink'
    - ' &7Restores 10 HP'
    - ' &7Grants regeneration for 10 seconds'
    - ''
    - ' &eSips left: &c%uses% &7of &43'
    - ''

  max-uses: 3
  uses-depleted-message: ""
  cooldown-message: ""
  equip-message: ""
  unequip-message: ""

  click-cooldown: 500

  triggers:
    on_click_right:
      - 'heal:10'
      - 'effect:REGENERATION:10:1'
      - 'particles:HEART:30'
      - 'particles:VILLAGER_HAPPY:20'
      - 'sound:ENTITY_PLAYER_BURP:1:1'

    on_pickup:
      - 'particles:HEART:10'

    on_drop:
      - 'particles:SMOKE:5'
