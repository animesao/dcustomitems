# ============================================
# EXAMPLE: ULTIMATE FIRE BLADE
# Demonstration of ALL plugin features
# ============================================

ultimate-fire-sword:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: example.fire_sword

  item:
    type: NETHERITE_SWORD
    title: '&c&l🔥 Ultimate Fire Blade'
    glowing: true
    unbreakable: true
    item-model: "ultimate_fire_sword"
    enchantments:
      SHARPNESS: 10
      FIRE_ASPECT: 2
      SWEEPING_EDGE: 3
      UNBREAKING: 3
      MENDING: 1

  lore:
    - ''
    - ' &c━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Legendary weapon of the fire elements'
    - ' &c━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fWhile in main hand:'
    - ' &6┌ &eStrength &cV'
    - ' &6├ &eSpeed &cIII'
    - ' &6├ &eRegeneration &cIII'
    - ' &6└ &eResistance &cII'
    - ''
    - '&c🔥 &fRight Click: Fire storm!'
    - '&c💥 &fLeft Click: AoE damage!'
    - '&c❤ &fOn kill: Full healing!'
    - ''

  effects:
    - 'INCREASE_DAMAGE:5'
    - 'SPEED:3'
    - 'REGENERATION:3'
    - 'RESISTANCE:2'

  attributes:
    GENERIC_ATTACK_DAMAGE: 25.0
    GENERIC_ATTACK_SPEED: 2.2
    GENERIC_MAX_HEALTH: 10.0
    GENERIC_ARMOR: 5.0
    GENERIC_ARMOR_TOUGHNESS: 5.0

  click-cooldown: 2000
  cooldown-message: ""

  triggers:
    on_equip:
      # Custom particles with offset
      - 'particles_custom:FLAME:100:0:1:0:2:2:2'
      - 'particles_custom:DRAGON_BREATH:50:0:2:0:1:1:1'
      # Sound sequence
      - 'sound_sequence:ENTITY_BLAZE_AMBIENT:1:1;ENTITY_PLAYER_LEVELUP:0.5:2'
      # Title
      - 'title:&c🔥 &lFIRE BLADE DRAWN!|&7The fire element obeys you!:10:40:10'

    on_unequip:
      - 'particles_custom:SMOKE:30:0:1:0:1:1:1'
      - 'sound:ENTITY_BLAZE_SHOOT:0.5:1.5'

    on_click_right:
      # Title sequence (animation)
      - 'title_sequence:🔥 PREPARATION!:::10:20:10;🔥 FIRE!:::10:30:10;🔥 STORM!:::10:40:10'
      
      # Custom particles (fire ring)
      - 'particles_custom:FLAME:200:0:1:0:3:1:3'
      - 'particles_custom:DRAGON_BREATH:100:0:2:0:2:2:2'
      
      # Custom damage (6x4x6 blocks)
      - 'damage_custom:30:6:4:6'
      
      # Sounds with delays
      - 'sound_sequence:ENTITY_BLAZE_SHOOT:1:1;ENTITY_GENERIC_EXPLODE:1:0.8;ENTITY_ENDER_DRAGON_GROWL:1:1'
      
      # Effects with delays
      - 'effect_sequence:STRENGTH:15:5:0;SPEED:15:3:500;FIRE_RESISTANCE:15:1:1000'
      
      # Custom healing for allies
      - 'heal_custom:15:8:5:8:HEART'

    on_click_left:
      # Custom damage
      - 'damage_custom:20:5:3:5'
      
      # Explosion particles
      - 'particles_custom:EXPLOSION_HUGE:10:0:1:0:2:2:2'
      - 'particles_custom:FLAME:150:0:1:0:3:2:3'
      
      # Explosion sound
      - 'sound:ENTITY_GENERIC_EXPLODE:1:0.8'
      
      # Knockback
      - 'knockback:5'

    on_kill:
      # Full healing
      - 'heal:50'
      
      # Healing effects
      - 'effect_sequence:REGENERATION:20:4:0;STRENGTH:20:5:1000;SPEED:20:3:2000'
      
      # Custom healing particles
      - 'particles_custom:HEART:100:0:2:0:2:2:2'
      - 'particles_custom:VILLAGER_HAPPY:50:0:3:0:1:1:1'
      
      # Level-up sound
      - 'sound:ENTITY_PLAYER_LEVELUP:1:2'
      
      # Firework
      - 'fireworks:1'

    on_damage_dealt:
      # Health theft
      - 'heal:8'
      
      # Blood particles
      - 'particles_custom:DRAGON_BREATH:20:0:1:0:0.5:0.5:0.5'
      
      # Vampire sound
      - 'sound:ENTITY_VAMPIRE_BITE:0.5:2'

    on_damage_taken:
      # Damage resistance
      - 'effect:RESISTANCE:8:3'
      
      # Protection particles
      - 'particles_custom:ENCHANTMENT_TABLE:30:0:1:0:1:1:1'

    on_jump:
      # Speed on jump
      - 'effect:SPEED:5:3'
      
      # Fiery trail
      - 'particles_custom:FLAME:20:0:-0.5:0:0.3:0.1:0.3'

    on_pickup:
      # Greeting
      - 'particles_custom:PORTAL:30:0:1:0:1:1:1'
      - 'sound:ENTITY_ENDERMAN_TELEPORT:0.5:1.2'

    on_drop:
      # Farewell
      - 'particles_custom:SMOKE:20:0:1:0:0.5:0.5:0.5'
