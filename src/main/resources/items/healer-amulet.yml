    type: TOTEM_OF_UNDYING
    title: '&c[❤] &fАмулет &cИсцеления'
    glowing: true
    unbreakable: true
    custom-model-data: 1004
  lore:
    - ''
    - ' &7Священный амулет, исцеляющий раны'
    - ' &7Постоянно восстанавливает здоровье'
