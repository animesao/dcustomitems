# ============================================
# АМУЛЕТ ИСЦЕЛЕНИЯ - Амулет с целительной силой
# ============================================

healer-amulet:
  type: RUNE
  activation-slot: OFFHAND
  placeable: false
  permission: healer.amulet

  item:
    type: TOTEM_OF_UNDYING
    title: '&c[❤] &fАмулет &cИсцеления'
    glowing: true
    unbreakable: true
    custom-model-data: 1004

  lore:
    - ''
    - ' &c━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Священный амулет'
    - ' &7исцеляющий раны'
    - ' &c━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fКогда во второй руке:'
    - ' &6┌ &eРегенерация &cIII &7(&6∞&7)'
    - ' &6├ &eПрилив здоровья &cII &7(&6∞&7)'
    - ' &6└ &eПоглощение &cI &7(&6∞&7)'
    - ''

  effects:
    - 'REGENERATION:3'
    - 'HEALTH_BOOST:2'
    - 'ABSORPTION:1'

  attributes:
    GENERIC_MAX_HEALTH: 6.0

  click-cooldown: 5000

  activation-message: '&c❤ &7Амулет Исцеления активирован!'
  deactivation-message: '&c❤ &7Амулет убран.'
  equip-message: '&c❤ &7Вы чувствуете тепло исцеления!'
  unequip-message: '&c❤ &7Тепло исчезает.'
  cooldown-message: '&c⏳ &7Подождите {seconds} сек!'
  uses-depleted-message: '&c💀 &7Амулет рассеялся!'

  trigger-actions:
    # --- При экипировке ---
    - 'on_equip:particle:HEART:20'
    - 'on_equip:particle:VILLAGER_HAPPY:15'
    - 'on_equip:sound:BLOCK_BEACON_ACTIVATE:1:1'
    - 'on_equip:message:&c❤ &7Вы чувствуете тепло исцеления!'

    # --- При снятии ---
    - 'on_unequip:particle:CLOUD:10'
    - 'on_unequip:sound:BLOCK_BEACON_DEACTIVATE:1:1'
    - 'on_unequip:message:&c❤ &7Тепло исчезает.'

    # --- При ПКМ ---
    - 'on_click_right:heal:20'
    - 'on_click_right:effect:REGENERATION:15:3'
    - 'on_click_right:effect:HEALTH_BOOST:15:2'
    - 'on_click_right:particle:HEART:25'
    - 'on_click_right:sound:ENTITY_PLAYER_LEVELUP:1:1.2'
    - 'on_click_right:title:&c❤ &7ИСЦЕЛЕНИЕ!::&aЖизнь наполняет!:10:40:10'
    - 'on_click_right:message:&c❤ &7Исцеление началось!'

    # --- При убийстве ---
    - 'on_kill:heal:20'
    - 'on_kill:effect:HEALTH_BOOST:30:2'
    - 'on_kill:effect:REGENERATION:20:3'
    - 'on_kill:particle:HEART:30'
    - 'on_kill:sound:ENTITY_PLAYER_LEVELUP:1:1.5'
    - 'on_kill:message:&c❤ &7Враг побежден!'

    # --- При нанесении урона ---
    - 'on_damage_dealt:heal:2'

    # --- При прыжке ---
    - 'on_jump:effect:SPEED:3:1'
    - 'on_jump:particle:HEART:8'

    # --- При получении урона ---
    - 'on_damage_taken:effect:REGENERATION:5:2'
    - 'on_damage_taken:effect:ABSORPTION:5:1'
    - 'on_damage_taken:particle:HEART:10'

    # --- При подборе ---
    - 'on_pickup:message:&c❤ &7Амулет подобран!'
    - 'on_pickup:particle:HEART:25'
    - 'on_pickup:sound:BLOCK_BEACON_ACTIVATE:1:1'

    # --- При выбрасывании ---
    - 'on_drop:message:&c❤ &7Амулет выброшен.'
    - 'on_drop:particle:CLOUD:10'
