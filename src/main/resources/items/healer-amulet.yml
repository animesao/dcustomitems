# ============================================
# АМУЛЕТ ИСЦЕЛЕНИЯ - Амулет с целительной силой
# ============================================
# Тип: Руна/Тотем
# Активация: Вторая рука
# Особенность: Постоянно исцеляет и дает бонусы
# ============================================

healer-amulet:
  # === ОСНОВНЫЕ ПАРАМЕТРЫ ===
  type: RUNE
  activation-slot: OFFHAND
  placeable: false
  permission: healer.amulet

  # === ПАРАМЕТРЫ ПРЕДМЕТА ===
  item:
    type: TOTEM_OF_UNDYING
    title: '&c[❤] &fАмулет &cИсцеления'
    glowing: true
    unbreakable: true
    custom-model-data: 1004

  # === ОПИСАНИЕ (ЛОР) ===
  lore:
    - ''
    - ' &c━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Священный амулет,'
    - ' &7исцеляющий раны'
    - ' &c━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fКогда во второй руке:'
    - ' &6┌ &eРегенерация &cIII &7(&6∞&7)'
    - ' &6├ &eПрилив здоровья &cII &7(&6∞&7)'
    - ' &6└ &eПоглощение &cI &7(&6∞&7)'
    - ''
    - '&c❤ &fПКМ: Исцеление nearby игроков'
    - '&c❤ &fПри убийстве: +5 сердец на 30 сек'
    - ''

  # === ПОСТОЯННЫЕ ЭФФЕКТЫ ===
  effects:
    - 'REGENERATION:3'
    - 'HEALTH_BOOST:2'
    - 'ABSORPTION:1'

  # === АТРИБУТЫ ===
  attributes:
    GENERIC_MAX_HEALTH: 6.0

  # === КУЛДОН КЛИКОВ ===
  click-cooldown: 5000

  # === ЭФФЕКТЫ ЭКИПИРОВКИ ===
  equip-particles:
    - 'HEART:20'
    - 'VILLAGER_HAPPY:15'
    - 'HAPPY_VILLAGER:10'
  equip-sounds:
    - 'BLOCK_BEACON_ACTIVATE:1:1'
    - 'ENTITY_PLAYER_LEVELUP:0.5:1.5'

  # === ЭФФЕКТЫ СНЯТИЯ ===
  unequip-particles:
    - 'CLOUD:10'
    - 'SMOKE_NORMAL:5'
  unequip-sounds:
    - 'BLOCK_BEACON_DEACTIVATE:1:1'

  # === СООБЩЕНИЯ ===
  activation-message: '&c❤ &7Амулет Исцеления активирован! &aЖизнь наполняет вас!'
  deactivation-message: '&c❤ &7Амулет убран. &cЖизнь отступает.'
  equip-message: '&c❤ &7Вы чувствуете тепло исцеления!'
  unequip-message: '&c❤ &7Тепло исчезает.'
  cooldown-message: '&c⏳ &7Подождите {seconds} сек!'
  uses-depleted-message: '&c💀 &7Амулет рассеялся!'

  # === ДЕЙСТВИЯ ПРИ ПКМ ===
  right-click-actions:
    - 'heal:20'
    - 'effect:REGENERATION:15:3'
    - 'effect:HEALTH_BOOST:15:2'
    - 'effect:ABSORPTION:15:2'
    - 'particle:HEART:25'
    - 'particle:VILLAGER_HAPPY:20'
    - 'sound:ENTITY_PLAYER_LEVELUP:1:1.2'
    - 'title:&c❤ &7ИСЦЕЛЕНИЕ!::&aЖизнь наполняет вас!:10:40:10'
    - 'message:&c❤ &7Исцеление началось! &aВы чувствуете невероятное тепло!'

  # === ТРИГГЕРЫ ===
  trigger-actions:
    # При убийстве - БОНУСЫ
    - 'on_kill:heal:20'
    - 'on_kill:effect:HEALTH_BOOST:30:2'
    - 'on_kill:effect:REGENERATION:20:3'
    - 'on_kill:particle:HEART:30'
    - 'on_kill:sound:ENTITY_PLAYER_LEVELUP:1:1.5'
    - 'on_kill:message:&c❤ &7Враг побежден! &aЗдоровье усилено!'

    # При нанесении урона
    - 'on_damage_dealt:heal:2'

    # При прыжке
    - 'on_jump:effect:SPEED:3:1'
    - 'on_jump:particle:HEART:8'

    # При получении урона
    - 'on_damage_taken:effect:REGENERATION:5:2'
    - 'on_damage_taken:effect:ABSORPTION:5:1'
    - 'on_damage_taken:particle:HEART:10'

    # При подборе
    - 'on_pickup:message:&c❤ &7Амулет подобран! &aСила исцеления!'
    - 'on_pickup:particle:HEART:25'
    - 'on_pickup:sound:BLOCK_BEACON_ACTIVATE:1:1'

    # При выбрасывании
    - 'on_drop:message:&c❤ &7Амулет выброшен. &cИсцеление прекращается.'
    - 'on_drop:particle:CLOUD:10'
