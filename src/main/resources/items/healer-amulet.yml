# ============================================
# АМУЛЕТ ЦЕЛИТЕЛЯ - Исцеляющие способности
# ============================================

healer-amulet:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: healer.amulet

  item:
    type: NETHERITE_SWORD
    title: '&a[💚] &fАмулет &aЦелителя'
    glowing: true
    unbreakable: true
    item-model: "healer_amulet"
    enchantments:
      SHARPNESS: 3
      UNBREAKING: 3
      MENDING: 1

  lore:
    - ''
    - ' &a━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Амулет исцеления'
    - ' &a━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fКогда в основной руке:'
    - ' &6┌ &eРегенерация &aIII'
    - ' &6└ &eСкорость &aI'
    - ''
    - '&a💚 &fПКМ: Исцеление'
    - ''

  effects:
    - 'REGENERATION:3'
    - 'SPEED:1'

  click-cooldown: 2000
  cooldown-message: ""

  triggers:
    on_equip:
      - 'particles:HEART:20'
      - 'sound:ENTITY_PLAYER_LEVELUP:0.5:1.5'

    on_unequip:
      - 'particles:SMOKE:10'

    on_click_right:
      - 'heal:20'
      - 'effect:REGENERATION:15:3'
      - 'effect:SPEED:10:2'
      - 'particles:HEART:50'
      - 'particles:VILLAGER_HAPPY:30'
      - 'sound:ENTITY_PLAYER_LEVELUP:1:2'
      - 'title:&a💚 &7ИСЦЕЛЕНИЕ!|&aПолное восстановление!:10:40:10'

    on_click_left:
      - 'heal_nearby:10:5'
      - 'effect:REGENERATION:8:2'
      - 'particles:HEART:40'
      - 'sound:ENTITY_PLAYER_LEVELUP:0.8:1.5'

    on_kill:
      - 'heal:30'
      - 'effect:REGENERATION:10:3'
      - 'particles:HEART:30'
      - 'sound:ENTITY_PLAYER_LEVELUP:1:2'

    on_damage_taken:
      - 'effect:REGENERATION:5:2'
      - 'particles:HEART:10'

    on_pickup:
      - 'particles:HEART:15'

    on_drop:
      - 'particles:SMOKE:10'
