# ============================================
# ТОТЕМ ПРИРОДЫ - Силы природы
# ============================================

nature-totem:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: nature.totem

  item:
    type: NETHERITE_SWORD
    title: '&2[🌿] &fТотем &2Природы'
    glowing: true
    unbreakable: true
    item-model: "nature_totem"
    enchantments:
      SHARPNESS: 4
      UNBREAKING: 3
      MENDING: 1

  lore:
    - ''
    - ' &2━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Тотем силы природы'
    - ' &2━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fКогда в основной руке:'
    - ' &6┌ &eРегенерация &2III'
    - ' &6└ &eСкорость &2II'
    - ''
    - '&2🌿 &fПКМ: Сила природы'
    - ''

  effects:
    - 'REGENERATION:3'
    - 'SPEED:2'

  attributes:
    GENERIC_ATTACK_DAMAGE: 8.0
    GENERIC_ATTACK_SPEED: 1.6

  click-cooldown: 2000
  cooldown-message: ""

  triggers:
    on_equip:
      - 'particles:VILLAGER_HAPPY:25'
      - 'sound:ENTITY_PLAYER_LEVELUP:0.5:1.5'

    on_unequip:
      - 'particles:SMOKE:10'

    on_click_right:
      - 'heal:15'
      - 'effect:REGENERATION:15:3'
      - 'effect:SPEED:10:2'
      - 'effect:ABSORPTION:30:1'
      - 'particles:VILLAGER_HAPPY:40'
      - 'particles:HEART:30'
      - 'sound:ENTITY_PLAYER_LEVELUP:1:2'
      - 'title:&2🌿 &7СИЛА ПРИРОДЫ!::&aВосстановление + Абсорбция!:10:40:10'

    on_click_left:
      - 'damage_nearby:10:4'
      - 'effect:SLOWNESS:5:1'
      - 'particles:VILLAGER_HAPPY:30'
      - 'knockback:3'

    on_kill:
      - 'heal:25'
      - 'effect:REGENERATION:12:3'
      - 'particles:HEART:25'
      - 'sound:ENTITY_PLAYER_LEVELUP:1:1.5'

    on_damage_taken:
      - 'effect:REGENERATION:5:2'
      - 'effect:RESISTANCE:3:1'
      - 'particles:VILLAGER_HAPPY:10'

    on_pickup:
      - 'particles:VILLAGER_HAPPY:15'

    on_drop:
      - 'particles:SMOKE:10'
