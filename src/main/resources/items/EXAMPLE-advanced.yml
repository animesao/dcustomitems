# ==========================================
# ADVANCED ITEMS (attributes, particles, sounds, triggers)
# ==========================================

legendary-sword:
  item:
    type: DIAMOND_SWORD
    title: '&6[⚔] &fLegendary Sword'
    glowing: true
    unbreakable: true
    custom-model-data: 1001
    enchantments:
      SHARPNESS: 5
      DURABILITY: 3
      FIRE_ASPECT: 2
  lore:
    - ''
    - ' &7Legendary sword of ancient warriors'
    - ' &7While in main hand:'
    - ' &6┌ &e⇄ &fStrength &6III &7(&6∞&7)'
    - ' &6└ &e⇄ &fSpeed &6II &7(&6∞&7)'
    - ''
    - '&6✦ &fDeals &c4x &fdamage'
    - '&6✦ &fRestores health on kill'
    - ''
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: legendary.sword
  equip-particles:
    - 'FLAME:20'
    - 'ENCHANTMENT_TABLE:15'
  equip-sounds:
    - 'ITEM_TRIDENT_RETURN:1:1.2'
  unequip-particles:
    - 'SMOKE_NORMAL:10'
  unequip-sounds:
    - 'ITEM_TRIDENT_HIT:0.8:0.8'
  effects:
    - 'INCREASE_DAMAGE:3'
    - 'SPEED:2'
  triggers:
    on_kill:
      - 'effect:REGENERATION:10:2'
      - 'message:&6⚔ &fEnemy defeated! Regeneration for 10 sec!'
      - 'particle:VILLAGER_HAPPY:15'

guardian-shield:
  item:
    type: SHIELD
    title: '&b[🛡] &fGuardian Shield'
    glowing: true
    unbreakable: true
    custom-model-data: 2001
  lore:
    - ''
    - ' &7Magic shield that protects its owner'
    - ' &7Grants resistance when taking damage!'
    - ''
    - '&b✦ &fOn damage: Resistance for 5 sec'
    - '&b✦ &fOn jump: Speed for 3 sec'
    - ''
  type: TOOL
  activation-slot: OFFHAND
  placeable: false
  permission: guardian.shield
  equip-particles:
    - 'SPELL_WITCH:10'
  equip-sounds:
    - 'ITEM_ARMOR_EQUIP_DIAMOND:1:1'
  unequip-sounds:
    - 'ITEM_ARMOR_EQUIP_LEATHER:0.8:0.8'
  effects:
    - 'DAMAGE_RESISTANCE:2'
    - 'HEALTH_BOOST:1'
  triggers:
    on_damage_taken:
      - 'effect:DAMAGE_RESISTANCE:5:1'
      - 'particle:EXPLOSION_NORMAL:5'
      - 'sound:ENTITY_IRON_GOLEM_ATTACK:1:1'
    on_jump:
      - 'effect:SPEED:3:1'
      - 'particle:CLOUD:8'

farmer-scissors:
  item:
    type: SHEARS
    title: '&a[✂] &fFarmer Shears'
    glowing: true
    unbreakable: true
    custom-model-data: 3001
  lore:
    - ''
    - ' &7Magic shears for harvesting crops'
    - ' &7Jump around and harvest faster!'
    - ''
    - '&a✦ &fJump: Haste III for 5 sec'
    - '&a✦ &fKill: Saturation for 10 sec'
    - ''
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: farmer.scissors
  equip-particles:
    - 'VILLAGER_HAPPY:15'
  equip-sounds:
    - 'BLOCK_GRASS_PLACE:1:1'
  effects:
    - 'HASTE:2'
  triggers:
    on_jump:
      - 'effect:HASTE:5:2'
      - 'message:&a🌿 Haste enabled!'
    on_kill:
      - 'effect:SATURATION:10:1'
      - 'message:&a🍎 Saturation activated!'

example-custom-messages:
  item:
    type: DIAMOND_SWORD
    title: '&c[⚔] &fSword with Messages'
    glowing: true
    unbreakable: true
  lore:
    - ''
    - ' &7While in main hand:'
    - ' &6┌ &e⇄ &fStrength &cIII &7(&6∞&7)'
    - ' &6└ &e⇄ &fSpeed &cII &7(&6∞&7)'
    - ''
    - '&7Uses: &b%uses%'
    - '&7Cooldown: &b%cooldown% sec.'
    - ''
  type: TOOL
  activation-slot: HAND
  placeable: false
  click-cooldown: 3000
  max-uses: 50
  effects:
    - 'INCREASE_DAMAGE:3'
    - 'SPEED:2'
  equip-message: '&a⚔ Sword drawn! Strength activated!'
  unequip-message: '&c⚔ Sword sheathed.'
  cooldown-message: '&c⏳ Wait {seconds} sec. before the next strike!'
  activation-message: '&a✨ Sword effects activated!'
  deactivation-message: '&c💤 Sword effects deactivated.'
  uses-depleted-message: '&c⚔ Sword broke! Uses depleted!'
