# ============================================
# ПАЛОЧКА ВОЗДУХА - Молния + Частицы
# ============================================

air-wand:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: wand.air

  item:
    type: BLAZE_ROD
    title: '&b✨ &fПалочка Воздуха'
    glowing: true
    unbreakable: true
    item-model: "air_wand"

  lore:
    - ''
    - ' &b━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Палочка стихии воздуха'
    - ' &b━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &b✨ &fПКМ: Волшебство воздуха'
    - ' &7Спавнит частицы облака'
    - ''
    - ' &e⚡ &fЛКМ: Молния'
    - ' &7Бьет молнией туда куда смотришь!'
    - ''

  click-cooldown: 500
  cooldown-message: ""
  equip-message: ""
  unequip-message: ""

  triggers:
    on_click_right:
      - 'particles:CLOUD:20'
      - 'sound:ENTITY_GUARDIAN_AMBIENT:1:1'

    on_click_left:
      - 'lightning_forward:100'
      - 'particles:EXPLOSION_HUGE:5'

    on_equip:
      - 'particles:CLOUD:15'

    on_unequip:
      - 'particles:SMOKE:10'
