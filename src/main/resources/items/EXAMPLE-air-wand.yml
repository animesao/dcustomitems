# ============================================
# AIR WAND - Lightning + Particles
# ============================================

air-wand:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: wand.air

  item:
    type: BLAZE_ROD
    title: '&b✨ &fAir Wand'
    glowing: true
    unbreakable: true
    item-model: "air_wand"

  lore:
    - ''
    - ' &b━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Wand of the air element'
    - ' &b━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &b✨ &fRight Click: Air magic'
    - ' &7Spawns cloud particles'
    - ''
    - ' &e⚡ &fLeft Click: Lightning'
    - ' &7Strikes lightning where you look!'
    - ''

  click-cooldown: 500
  cooldown-message: ""
  equip-message: ""
  unequip-message: ""

  triggers:
    on_click_right:
      - 'particles:CLOUD:20'
      - 'sound:ENTITY_GUARDIAN_AMBIENT:1:1'

    on_click_left:
      - 'lightning_forward:100'
      - 'particles:EXPLOSION_HUGE:5'

    on_equip:
      - 'particles:CLOUD:15'

    on_unequip:
      - 'particles:SMOKE:10'
