# ==========================================
# 📔 Module: Player Diary
# ==========================================
#
# Statistics tracker: kills, deaths, playtime
#
# Commands:
#   /diary           — open the diary
#   /diary stats     — statistics
#   /diary top       — top players
#
# Placeholders:
#   %dci_diary_kills%      — kill count
#   %dci_diary_deaths%     — death count
#   %dci_diary_playtime%   — play time (hours)
#   %dci_diary_kd%         — K/D ratio
#
# ==========================================

name: "Player Diary"
version: "1.0"
enabled: true
description: "Player diary — a kills/deaths/playtime tracker"
author: "DC-CustomItems"

commands:
  - diary

permissions:
  - diary.use
  - diary.admin

settings:
  enabled: true
  message-prefix: '&6📔 &r'
  # Data save interval (in ticks)
  save-interval: 600  # 30 seconds

# Time format in messages
time-format:
  hours: '{h}h {m}m'
  minutes: '{m}m {s}s'
