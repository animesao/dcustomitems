# ==========================================
# 📦 Module Template
# ==========================================
#
# This is a template for creating a new DC-CustomItems module.
#
# How to use it:
#   1. Copy the _template/ folder into items/my-module/
#   2. Rename template.java → my-module.java
#   3. Inside the file replace all "template" with "my-module"
#   4. Change config.yml to fit your needs
#   5. Run /ci reload
#
# Module structure:
#   items/my-module/
#   ├── config.yml        — Settings (this file)
#   ├── my-module.java    — The main module class
#   ├── items.yml         — Module items (optional)
#   └── README.md         — Documentation (optional)
#
# ==========================================

# Module name (shown in the logs)
name: "My Module"

# Module version
version: "1.0"

# Enable/disable the module (false = the module is not loaded)
enabled: true

# Module description
description: "Description of what this module does"

# Module author
author: "YourName"

# ==========================================
# COMMANDS
# ==========================================
# A list of the commands the module registers.
# The commands are registered automatically when the module is loaded.
#
# Format:
#   commands:
#     - command1
#     - command2
#
# After registration the following is available:
#   /command1 <args>
#   /command2 <args>
#
commands: []

# ==========================================
# PERMISSIONS
# ==========================================
# A list of the permissions used by the module.
# Format: <permission>.<action>
#
# Example:
#   permissions:
#     - mymodule.use
#     - mymodule.admin
#
permissions: []

# ==========================================
# SETTINGS (example)
# ==========================================
# You can add any module settings here.
# They are available via config.getString(), config.getInt(), etc.
#
# Example:
# settings:
#   enabled: true
#   max-items: 10
#   price-multiplier: 1.5
#   message-prefix: "&a[MyModule] &r"
#
# Usage in code:
#   String prefix = config.getString("settings.message-prefix", "&a[Module] &r");
#   int maxItems = config.getInt("settings.max-items", 10);
#
settings:
  enabled: true
  message-prefix: "&a[MyModule] &r"

# ==========================================
# MENU CONFIGURATION (optional)
# ==========================================
# If the module provides a GUI menu.
#
# menu:
#   title: "&6My Menu"
#   size: 27
#   fill:
