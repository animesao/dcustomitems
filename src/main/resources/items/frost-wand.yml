# ============================================
# ЛЕДЯНАЯ ПАЛОЧКА - Ледяные заклинания
# ============================================

frost-wand:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: frost.wand

  item:
    type: BLAZE_ROD
    title: '&b[❄] &fЛедяная &bПалочка'
    glowing: true
    unbreakable: true
    item-model: "frost_wand"
    enchantments:
      SHARPNESS: 4
      UNBREAKING: 3
      MENDING: 1

  lore:
    - ''
    - ' &b━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Палочка ледяной стихии'
    - ' &b━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &b❄ &fПКМ: Ледяной щит'
    - ' &e⚡ &fЛКМ: Ледяная буря'
    - ''

  effects:
    - 'SPEED:2'
    - 'RESISTANCE:1'

  click-cooldown: 1000
  cooldown-message: ""

  triggers:
    on_equip:
      - 'particles:SNOWFLAKE:30'
      - 'sound:ENTITY_PLAYER_BREATH:1:1.5'

    on_unequip:
      - 'particles:SMOKE:10'

    on_click_right:
      - 'effect:RESISTANCE:10:2'
      - 'effect:SPEED:10:2'
      - 'particles:SNOWFLAKE:50'
      - 'particles:BLOCK_CRACK:30'
      - 'sound:ENTITY_GENERIC_FREEZE:1:1'
      - 'title:&b❄ &7ЛЕДЯНОЙ ЩИТ!::&bСопротивление II на 10 сек!:10:30:10'

    on_click_left:
      - 'damage_nearby:15:5'
      - 'effect:SLOWNESS:5:2'
      - 'particles:SNOWFLAKE:80'
      - 'particles:BLOCK_CRACK:40'
      - 'sound:ENTITY_GENERIC_FREEZE:1:0.8'
      - 'knockback:3'
      - 'title:&b❄ &7ЛЕДЯНАЯ БУРЯ!::&bВсе враги заморожены!:10:30:10'

    on_kill:
      - 'heal:15'
      - 'effect:REGENERATION:8:2'
      - 'particles:HEART:20'
      - 'sound:ENTITY_PLAYER_LEVELUP:1:1.5'

    on_damage_dealt:
      - 'effect:SLOWNESS:3:1'
      - 'particles:SNOWFLAKE:15'

    on_damage_taken:
      - 'effect:RESISTANCE:5:1'
      - 'particles:SNOWFLAKE:10'

    on_pickup:
      - 'particles:SNOWFLAKE:20'

    on_drop:
      - 'particles:SMOKE:10'
