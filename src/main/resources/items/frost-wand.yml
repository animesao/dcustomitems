# ============================================
# ПОСОХ МОРОЗА - Магический посох с ледяной магией
# ============================================

frost-wand:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: frost.wand
  max-uses: 100

  item:
    type: BLAZE_ROD
    title: '&b[❄] &fПосох &bМороза'
    glowing: true
    unbreakable: true
    custom-model-data: 1002

  lore:
    - ''
    - ' &b━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Ледяной посох'
    - ' &b━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fКогда в основной руке:'
    - ' &6┌ &eСопротивление &bIII &7(&6∞&7)'
    - ' &6├ &eСкорость &bII &7(&6∞&7)'
    - ' &6└ &eОгнестойкость &7(&6∞&7)'
    - ''
    - '&b❄ &fИспользований: &b%uses%'
    - ''

  effects:
    - 'DAMAGE_RESISTANCE:3'
    - 'SPEED:2'
    - 'FIRE_RESISTANCE:1'

  click-cooldown: 2000

  activation-message: '&b❄ &7Посох Мороза активирован!'
  deactivation-message: '&b❄ &7Посох убран.'
  equip-message: '&b❄ &7Вы чувствуете холод!'
  unequip-message: '&b❄ &7Холод уходит.'
  cooldown-message: '&b⏳ &7Подождите {seconds} сек!'
  uses-depleted-message: '&b💀 &7Посох сломался!'

  trigger-actions:
    # --- При экипировке ---
    - 'on_equip:particle:SNOWFLAKE:30'
    - 'on_equip:particle:SPELL_WITCH:15'
    - 'on_equip:sound:BLOCK_GLASS_BREAK:1:0.5'
    - 'on_equip:message:&b❄ &7Вы чувствуете холод!'

    # --- При снятии ---
    - 'on_unequip:particle:CLOUD:10'
    - 'on_unequip:sound:BLOCK_GLASS_BREAK:0.5:0.8'
    - 'on_unequip:message:&b❄ &7Холод уходит.'

    # --- При ПКМ ---
    - 'on_click_right:effect:SLOW:5:2'
    - 'on_click_right:effect:RESISTANCE:5:2'
    - 'on_click_right:particle:SNOWFLAKE:35'
    - 'on_click_right:sound:BLOCK_GLASS_BREAK:1:0.5'
    - 'on_click_right:title:&b❄ &7ЗАМОРОЗКА!::&bВраги заморожены!:10:40:10'
    - 'on_click_right:message:&b❄ &7Враги заморожены!'

    # --- При убийстве ---
    - 'on_kill:effect:DAMAGE_RESISTANCE:10:2'
    - 'on_kill:particle:SNOWFLAKE:20'
    - 'on_kill:sound:BLOCK_GLASS_BREAK:0.5:1.5'
    - 'on_kill:message:&b❄ &7Враг заморожен!'

    # --- При нанесении урона ---
    - 'on_damage_dealt:effect:SLOW:3:1'
    - 'on_damage_dealt:particle:SNOWFLAKE:8'

    # --- При прыжке ---
    - 'on_jump:effect:SPEED:3:2'
    - 'on_jump:particle:SNOWFLAKE:10'

    # --- При получении урона ---
    - 'on_damage_taken:effect:DAMAGE_RESISTANCE:5:2'
    - 'on_damage_taken:particle:SNOWFLAKE:12'

    # --- При подборе ---
    - 'on_pickup:message:&b❄ &7Посох подобран!'
    - 'on_pickup:particle:SNOWFLAKE:25'

    # --- При выбрасывании ---
    - 'on_drop:message:&b❄ &7Посох выброшен.'
    - 'on_drop:particle:CLOUD:10'
