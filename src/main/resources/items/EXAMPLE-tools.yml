  type: TOOL
  activation-slot: HAND
  placeable: false
  click-cooldown: 2000
  trigger-actions:
    - 'on_click_right:lightning:1'
    - 'on_click_right:particle:FIREWORKS_SPARK:10'
    - 'on_click_right:sound:ENTITY_LIGHTNING_BOLT_THUNDER:1:1'
