# ============================================
# ТОПОР ГРОМА - Мощный топор с молниями
# ============================================

thunder-axe:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: thunder.axe

  item:
    type: NETHERITE_AXE
    title: '&e[⚡] &fТопор &eГрома'
    glowing: true
    unbreakable: true
    item-model: "thunder_axe"
    enchantments:
      SHARPNESS: 7
      SMITE: 5
      UNBREAKING: 3
      CHANNELING: 1

  lore:
    - ''
    - ' &e━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Топор, закаленный в'
    - ' &7небесной ярости'
    - ' &e━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fКогда в основной руке:'
    - ' &6┌ &eСила &eIII'
    - ' &6├ &eСкорость &eII'
    - ' &6└ &eСпешка &eI'
    - ''

  effects:
    - 'INCREASE_DAMAGE:3'
    - 'SPEED:2'
    - 'HASTE:1'

  attributes:
    GENERIC_ATTACK_DAMAGE: 12.0
    GENERIC_ATTACK_SPEED: 1.4

  click-cooldown: 1500
  cooldown-message: ""

  triggers:
    on_equip:
      - 'particles:FIREWORKS_SPARK:25'
      - 'particles:CLOUD:15'
      - 'particles:FLASH:10'
      - 'sound:ENTITY_LIGHTNING_BOLT_THUNDER:1:1'

    on_unequip:
      - 'particles:SMOKE:10'
      - 'particles:CLOUD:8'
      - 'sound:ENTITY_LIGHTNING_BOLT_THUNDER:0.5:0.8'

    on_click_right:
      - 'lightning_forward:100'
      - 'particles:FIREWORKS_SPARK:30'
      - 'particles:EXPLOSION_HUGE:5'
      - 'sound:ENTITY_LIGHTNING_BOLT_THUNDER:1:1'
      - 'title:&e⚡ &7УДАР МОЛНИИ!|&eНебеса повинуются!:10:40:10'

    on_click_left:
      - 'lightning_forward:100'
      - 'particles:EXPLOSION_HUGE:10'
      - 'particles:FIREWORKS_SPARK:40'
      - 'sound:ENTITY_LIGHTNING_BOLT_IMPACT:1:1'

    on_kill:
      - 'effect:HASTE:15:3'
      - 'effect:SPEED:15:2'
      - 'particles:VILLAGER_HAPPY:20'
      - 'particles:FIREWORKS_SPARK:15'
      - 'sound:ENTITY_PLAYER_LEVELUP:1:1.5'

    on_damage_dealt:
      - 'particles:FIREWORKS_SPARK:12'
      - 'sound:ENTITY_LIGHTNING_BOLT_THUNDER:0.3:2'
      - 'lightning_forward:100'

    on_jump:
      - 'particles:CLOUD:10'
      - 'sound:ENTITY_FIREWORK_ROCKET_LAUNCH:0.3:2'

    on_damage_taken:
      - 'effect:STRENGTH:5:2'
      - 'particles:FLASH:8'

    on_pickup:
      - 'particles:FIREWORKS_SPARK:20'
      - 'sound:ENTITY_LIGHTNING_BOLT_THUNDER:0.5:1.5'

    on_drop:
      - 'particles:SMOKE:15'
