# ============================================
# ЛУК ЛУЧНИКА - Специальные стрелы
# ============================================

archer-bow:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: archer.bow

  item:
    type: BOW
    title: '&e[🏹] &fЛук &eЛучника'
    glowing: true
    unbreakable: true
    item-model: "archer_bow"
    enchantments:
      POWER: 5
      FLAME: 1
      INFINITY: 1
      UNBREAKING: 3
      PUNCH: 2

  lore:
    - ''
    - ' &e━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Легендарный лук лучника'
    - ' &e━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fКогда в основной руке:'
    - ' &6┌ &eСкорость &eII'
    - ' &6└ &eСпешка &eI'
    - ''
    - '&c🔥 &fЛКМ: Огненная стрела'
    - ''

  effects:
    - 'SPEED:2'
    - 'HASTE:1'

  click-cooldown: 500
  cooldown-message: ""

  triggers:
    on_equip:
      - 'particles:CRIT:20'
      - 'sound:ENTITY_ARROW_SHOOT:0.5:1.5'

    on_unequip:
      - 'particles:SMOKE:10'

    on_click_left:
      - 'effect:SPEED:5:2'
      - 'particles:CRIT:30'
      - 'sound:ENTITY_ARROW_SHOOT:1:1.2'

    on_kill:
      - 'heal:10'
      - 'effect:REGENERATION:8:2'
      - 'particles:HEART:20'
      - 'sound:ENTITY_PLAYER_LEVELUP:1:1.5'

    on_damage_dealt:
      - 'particles:CRIT:8'
      - 'sound:ENTITY_ARROW_HIT:0.5:2'

    on_pickup:
      - 'particles:CRIT:15'

    on_drop:
      - 'particles:SMOKE:10'
