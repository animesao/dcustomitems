# ============================================
# ЛУК СТРЕЛКА - Магический лук
# ============================================

archer-bow:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: archer.bow

  item:
    type: BOW
    title: '&2[🏹] &fЛук &2Стрелка'
    glowing: true
    unbreakable: true
    custom-model-data: 1008
    enchantments:
      POWER: 6
      FLAME: 2
      INFINITY: 1
      DURABILITY: 3

  lore:
    - ''
    - ' &2━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Волшебный лук'
    - ' &2━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fКогда в основной руке:'
    - ' &6┌ &eСила &2III &7(&6∞&7)'
    - ' &6├ &eСкорость &2II &7(&6∞&7)'
    - ' &6└ &eУдача &2I &7(&6∞&7)'
    - ''

  effects:
    - 'INCREASE_DAMAGE:3'
    - 'SPEED:2'
    - 'LUCK:1'

  click-cooldown: 1000

  activation-message: '&2🏹 &7Лук Стрелка извлечен!'
  deactivation-message: '&2🏹 &7Лук убран.'
  equip-message: '&2🏹 &7Вы чувствуете силу лука!'
  unequip-message: '&2🏹 &7Сила лука уходит.'
  cooldown-message: '&2⏳ &7Подождите {seconds} сек!'
  uses-depleted-message: '&2💀 &7Лук сломался!'

  trigger-actions:
    # --- При экипировке ---
    - 'on_equip:particle:CRIT:20'
    - 'on_equip:particle:FLAME:15'
    - 'on_equip:sound:ENTITY_ARROW_SHOOT:1:1'
    - 'on_equip:message:&2🏹 &7Вы чувствуете силу лука!'

    # --- При снятии ---
    - 'on_unequip:particle:CLOUD:8'
    - 'on_unequip:sound:ENTITY_ARROW_SHOOT:0.5:0.8'
    - 'on_unequip:message:&2🏹 &7Сила лука уходит.'

    # --- При убийстве ---
    - 'on_kill:effect:HASTE:15:3'
    - 'on_kill:effect:SPEED:15:2'
    - 'on_kill:effect:LUCK:15:2'
    - 'on_kill:particle:VILLAGER_HAPPY:20'
    - 'on_kill:sound:ENTITY_PLAYER_LEVELUP:1:1.5'
    - 'on_kill:message:&2🏹 &7Враг поражен!'

    # --- При нанесении урона ---
    - 'on_damage_dealt:particle:CRIT:12'
    - 'on_damage_dealt:sound:ENTITY_ARROW_SHOOT:0.5:2'

    # --- При прыжке ---
    - 'on_jump:effect:SPEED:3:2'
    - 'on_jump:particle:CRIT:8'

    # --- При получении урона ---
    - 'on_damage_taken:effect:RESISTANCE:5:1'
    - 'on_damage_taken:particle:CRIT:8'

    # --- При подборе ---
    - 'on_pickup:message:&2🏹 &7Лук подобран!'
    - 'on_pickup:particle:CRIT:20'

    # --- При выбрасывании ---
    - 'on_drop:message:&2🏹 &7Лук выброшен.'
    - 'on_drop:particle:CLOUD:8'
