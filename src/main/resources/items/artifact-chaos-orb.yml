# ============================================
# СФЕРА ХАОСА - Случайные эффекты
# ============================================

artifact-chaos-orb:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: artifact.chaos_orb

  item:
    type: ENDER_EYE
    title: '&5[🌀] &fСфера &5Хаоса'
    glowing: true
    unbreakable: true
    item-model: "chaos_orb"
    enchantments:
      UNBREAKING: 3
      MENDING: 1

  lore:
    - ''
    - ' &5━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Сфера хаотической энергии'
    - ' &5━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fКогда в основной руке:'
    - ' &6┌ &eСкорость &5II'
    - ''
    - '&5🌀 &fПКМ: Выпустить хаос!'
    - ''

  effects:
    - 'SPEED:2'

  click-cooldown: 2000
  cooldown-message: ""

  triggers:
    on_equip:
      - 'particles:PORTAL:30'
      - 'sound:ENTITY_ENDERMAN_TELEPORT:1:1.2'

    on_unequip:
      - 'particles:SMOKE:10'

    on_click_right:
      - 'damage_nearby:20:8'
      - 'effect:SPEED:10:3'
      - 'effect:STRENGTH:10:2'
      - 'effect:RESISTANCE:10:2'
      - 'lightning_forward:100'
      - 'particles:PORTAL:60'
      - 'particles:EXPLOSION_HUGE:8'
      - 'sound:ENTITY_ENDER_DRAGON_GROWL:1:1'
      - 'title:&5🌀 &7ХАОС ВЫПУЩЕН!::&5Все враги в панике!:10:40:10'

    on_click_left:
      - 'damage_nearby:15:6'
      - 'effect:SLOWNESS:5:2'
      - 'particles:PORTAL:40'
      - 'knockback:5'
      - 'sound:ENTITY_ENDERMAN_TELEPORT:1:1.5'

    on_kill:
      - 'heal:25'
      - 'effect:REGENERATION:10:2'
      - 'particles:PORTAL:25'
      - 'sound:ENTITY_PLAYER_LEVELUP:1:1.5'

    on_damage_dealt:
      - 'particles:PORTAL:10'
      - 'sound:ENTITY_ENDERMAN_HURT:0.5:2'

    on_damage_taken:
      - 'effect:RESISTANCE:5:2'
      - 'particles:PORTAL:10'

    on_pickup:
      - 'particles:PORTAL:20'
      - 'sound:ENTITY_ENDERMAN_TELEPORT:0.5:1.2'

    on_drop:
      - 'particles:SMOKE:10'
