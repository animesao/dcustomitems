# ============================================
# FIRE RESISTANCE POTION - Protection from fire
# ============================================

fire-resistance-potion:
  type: CONSUMABLE
  activation-slot: HAND
  placeable: false
  permission: potion.fire_resistance

  item:
    type: GLASS_BOTTLE
    title: '&c[🔥] &fPotion &cof Fire Resistance'
    glowing: true
    unbreakable: false
    item-model: "fire_resistance_potion"
    amount: 1

  lore:
    - ''
    - ' &c━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Potion of fire protection'
    - ' &c━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &c🔥 &fRight Click: Drink'
    - ' &7Grants Fire Resistance for 60 seconds'
    - ''
    - ' &eSips left: &c%uses% &7of &43'
    - ''

  max-uses: 3
  uses-depleted-message: ""
  cooldown-message: ""
  equip-message: ""
  unequip-message: ""

  click-cooldown: 500

  triggers:
    on_click_right:
      - 'effect:FIRE_RESISTANCE:60:1'
      - 'particles:FLAME:60'
      - 'particles:LAVA:30'
      - 'sound:ENTITY_PLAYER_BURP:1:1'

    on_pickup:
      - 'particles:FLAME:10'

    on_drop:
      - 'particles:SMOKE:5'
