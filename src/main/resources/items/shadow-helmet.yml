# ============================================
# ТЕНЕВОЙ ШЛЕМ - Режим скрытности
# ============================================

shadow-helmet:
  type: ARMOR
  activation-slot: HEAD
  placeable: false
  permission: shadow.helmet

  item:
    type: NETHERITE_HELMET
    title: '&8[👁] &fТеневой &8Шлем'
    glowing: true
    unbreakable: true
    item-model: "shadow_helmet"
    enchantments:
      PROTECTION: 5
      UNBREAKING: 3
      MENDING: 1
      AQUA_AFFINITY: 1
      RESPIRATION: 3

  lore:
    - ''
    - ' &8━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Шлем теневого мастера'
    - ' &8━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fНа голове:'
    - ' &6┌ &eСопротивление &8II'
    - ' &6└ &eНевидимость &8при приседании'
    - ''

  effects:
    - 'RESISTANCE:2'
    - 'NIGHT_VISION:1'

  attributes:
    GENERIC_ARMOR: 5.0
    GENERIC_ARMOR_TOUGHNESS: 3.0

  click-cooldown: 3000
  cooldown-message: ""

  triggers:
    on_equip:
      - 'particles:PORTAL:20'
      - 'sound:ENTITY_ENDERMAN_TELEPORT:1:1.2'

    on_unequip:
      - 'particles:SMOKE:10'

    on_click_right:
      - 'vanish:15'
      - 'effect:NIGHT_VISION:30:1'
      - 'particles:PORTAL:40'
      - 'sound:ENTITY_ENDERMAN_TELEPORT:1:1.5'
      - 'title:&8👁 &7ТЕНИ СКРЫТИЯ!::&8Невидимость на 15 сек!:10:30:10'

    on_damage_taken:
      - 'effect:RESISTANCE:5:2'
      - 'particles:PORTAL:15'
      - 'sound:ENTITY_ENDERMAN_TELEPORT:0.5:1.5'

    on_pickup:
      - 'particles:PORTAL:15'

    on_drop:
      - 'particles:SMOKE:10'
