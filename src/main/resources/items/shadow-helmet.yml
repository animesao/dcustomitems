# ============================================
# ШЛЕМ ТЕНИ - Шлем, дающий ночное зрение
# ============================================

shadow-helmet:
  type: ARMOR
  activation-slot: HEAD
  placeable: false
  permission: shadow.helmet

  item:
    type: NETHERITE_HELMET
    title: '&5[👁] &fШлем &5Тени'
    glowing: true
    unbreakable: true
    custom-model-data: 1005
    enchantments:
      PROTECTION_ENVIRONMENTAL: 5
      DURABILITY: 3
      THORNS: 2

  lore:
    - ''
    - ' &5━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Шлем теней'
    - ' &5━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fКогда на голове:'
    - ' &6┌ &eНочное зрение &7(&6∞&7)'
    - ' &6├ &eСопротивление &5II &7(&6∞&7)'
    - ' &6└ &eНевидимость &5I &7(&6∞&7)'
    - ''

  effects:
    - 'NIGHT_VISION:1'
    - 'DAMAGE_RESISTANCE:2'
    - 'INVISIBILITY:1'

  attributes:
    GENERIC_ARMOR: 4.0
    GENERIC_ARMOR_TOUGHNESS: 2.0
    GENERIC_KNOCKBACK_RESISTANCE: 0.2

  armor-set: shadow-set
  has-set-bonus: true

  trigger-actions:
    # --- При экипировке ---
    - 'on_equip:particle:SPELL_WITCH:20'
    - 'on_equip:particle:PORTAL:15'
    - 'on_equip:sound:ITEM_ARMOR_EQUIP_NETHERITE:1:1'
    - 'on_equip:sound:ENTITY_ENDERMAN_TELEPORT:0.5:1.2'
    - 'on_equip:message:&5👁 &7Вы видите в темноте!'

    # --- При снятии ---
    - 'on_unequip:particle:SMOKE_NORMAL:10'
    - 'on_unequip:sound:ITEM_ARMOR_EQUIP_LEATHER:0.8:0.8'
    - 'on_unequip:message:&5👁 &7Зрение исчезает.'

    # --- При убийстве ---
    - 'on_kill:effect:NIGHT_VISION:15:1'
    - 'on_kill:effect:INVISIBILITY:10:1'
    - 'on_kill:particle:PORTAL:15'
    - 'on_kill:sound:ENTITY_ENDERMAN_TELEPORT:0.5:1.5'
    - 'on_kill:message:&5👁 &7Тени поглотили врага!'

    # --- При нанесении урона ---
    - 'on_damage_dealt:particle:PORTAL:8'
    - 'on_damage_dealt:sound:ENTITY_ENDERMAN_TELEPORT:0.3:2'

    # --- При прыжке ---
    - 'on_jump:effect:SPEED:3:1'
    - 'on_jump:particle:SMOKE_NORMAL:8'

    # --- При получении урона ---
    - 'on_damage_taken:effect:INVISIBILITY:5:1'
    - 'on_damage_taken:particle:PORTAL:12'
    - 'on_damage_taken:message:&5👁 &7Вы стали невидимы!'

    # --- При подборе ---
    - 'on_pickup:message:&5👁 &7Шлем подобран!'
    - 'on_pickup:particle:PORTAL:20'

    # --- При выбрасывании ---
    - 'on_drop:message:&5👁 &7Шлем выброшен.'
    - 'on_drop:particle:SMOKE_NORMAL:10'
