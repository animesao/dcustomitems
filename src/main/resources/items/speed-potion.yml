# ============================================
# ЗЕЛЬЕ СКОРОСТИ - Увеличивает скорость бега
# ============================================

speed-potion:
  type: CONSUMABLE
  activation-slot: HAND
  placeable: false
  permission: potion.speed

  item:
    type: GLASS_BOTTLE
    title: '&e[⚡] &fЗелье &eСкорости'
    glowing: true
    unbreakable: false
    item-model: "speed_potion"
    amount: 1

  lore:
    - ''
    - ' &e━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Зелье быстрого бега'
    - ' &e━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fПКМ: Выпить'
    - ' &7Даёт Скорость II на 30 секунд'
    - ''
    - ' &eОсталось глотков: &e%uses% &7из &65'
    - ''

  max-uses: 5
  uses-depleted-message: ""
  cooldown-message: ""
  equip-message: ""
  unequip-message: ""

  click-cooldown: 500

  triggers:
    on_click_right:
      - 'effect:SPEED:30:2'
      - 'particles:CLOUD:40'
      - 'particles:CRIT:25'
      - 'sound:ENTITY_PLAYER_BURP:1:1'

    on_pickup:
      - 'particles:CLOUD:10'

    on_drop:
      - 'particles:SMOKE:5'
