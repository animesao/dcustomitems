# ============================================
# ТЕНЬ КЛИНОК - Легендарный меч теней
# ============================================
# Тип: Оружие ближнего боя
# Активация: Основная рука
# Особенность: При убийстве восстанавливает здоровье
# ============================================

shadow-blade:
  # === ОСНОВНЫЕ ПАРАМЕТРЫ ===
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: shadow.blade

  # === ПАРАМЕТРЫ ПРЕДМЕТА ===
  item:
    type: NETHERITE_SWORD
    title: '&8[⚔] &7Тень &8Клинок'
    glowing: true
    unbreakable: true
    custom-model-data: 1001
    enchantments:
      SHARPNESS: 6
      LOOTING: 3
      FIRE_ASPECT: 2
      DURABILITY: 3

  # === ОПИСАНИЕ (ЛОР) ===
  lore:
    - ''
    - ' &8━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Легендарный клинок теней'
    - ' &7Созданный из чистой тьмы'
    - ' &8━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fКогда в основной руке:'
    - ' &6┌ &eСила &8III &7(&6∞&7)'
    - ' &6└ &eСкорость &8II &7(&6∞&7)'
    - ''
    - '&c❤ &fПри убийстве: Исцеление + Регенерация'
    - '&8✦ &fПри прыжке: Ускорение'
    - '&8✦ &fПри ударе: Частицы теней'
    - ''

  # === ПОСТОЯННЫЕ ЭФФЕКТЫ ===
  effects:
    - 'INCREASE_DAMAGE:3'
    - 'SPEED:2'

  # === АТРИБУТЫ ===
  attributes:
    GENERIC_ATTACK_DAMAGE: 8.0
    GENERIC_ATTACK_SPEED: 1.8
    GENERIC_MOVEMENT_SPEED: 0.15

  # === КУЛДОН КЛИКОВ ===
  click-cooldown: 1500

  # === ЭФФЕКТЫ ЭКИПИРОВКИ ===
  equip-particles:
    - 'SMOKE_LARGE:25'
    - 'ENCHANTMENT_TABLE:20'
    - 'PORTAL:15'
  equip-sounds:
    - 'ITEM_TRIDENT_RETURN:1:1.2'
    - 'ENTITY_ENDER_DRAGON_GROWL:0.3:1.5'

  # === ЭФФЕКТЫ СНЯТИЯ ===
  unequip-particles:
    - 'SMOKE_NORMAL:15'
    - 'CLOUD:10'
  unequip-sounds:
    - 'ENTITY_ENDERMAN_TELEPORT:0.5:1.2'

  # === СООБЩЕНИЯ ===
  activation-message: '&8⚔ &7Тень Клинок извлечен! &8Тени пробуждаются!'
  deactivation-message: '&8⚔ &7Клинок убран. &8Тени засыпают.'
  equip-message: '&8👁 &7Вы чувствуете силу теней!'
  unequip-message: '&8👁 &7Тени покидают вас.'
  cooldown-message: '&8⏳ &7Подождите {seconds} сек!'
  uses-depleted-message: '&8💀 &7Клинок рассеялся в тьме!'

  # === ДЕЙСТВИЯ ПРИ ПКМ ===
  right-click-actions:
    - 'effect:INCREASE_DAMAGE:8:3'
    - 'effect:SPEED:8:2'
    - 'particle:SMOKE_LARGE:30'
    - 'particle:ENCHANTMENT_TABLE:20'
    - 'sound:ENTITY_ENDER_DRAGON_GROWL:0.5:1.5'
    - 'sound:ENTITY_ENDERMAN_TELEPORT:0.3:2'
    - 'title:&8⚔ &7Активация теней!::&8Тени окружают вас!:10:40:10'
    - 'message:&8⚔ &7Тень Клинок активирован! Вы cảmствуете невероятную силу!'

  # === ДЕЙСТВИЯ ПРИ ЛКМ ===
  left-click-actions:
    - 'lightning:2'
    - 'particle:EXPLOSION_HUGE:5'
    - 'sound:ENTITY_LIGHTNING_BOLT_IMPACT:1:1'
    - 'message:&8⚡ &7Молнии призваны!'

  # === ТРИГГЕРЫ (срабатывают автоматически) ===
  trigger-actions:
    # При убийстве врага
    - 'on_kill:heal:20'
    - 'on_kill:effect:REGENERATION:10:2'
    - 'on_kill:effect:INCREASE_DAMAGE:5:2'
    - 'on_kill:particle:HEART:25'
    - 'on_kill:particle:DRAGON_BREATH:15'
    - 'on_kill:sound:ENTITY_PLAYER_LEVELUP:1:1.5'
    - 'on_kill:message:&8💀 &7Враг повержен! &cЖизнь поглощена!'
    - 'on_kill:announce:&8⚔ &7%player% &7уничтожил врага!'

    # При прыжке
    - 'on_jump:effect:SPEED:3:2'
    - 'on_jump:particle:SMOKE_NORMAL:10'
    - 'on_jump:sound:ENTITY_ENDERMAN_TELEPORT:0.3:1.5'

    # При нанесении урона
    - 'on_damage_dealt:particle:DRAGON_BREATH:8'
    - 'on_damage_dealt:sound:ENTITY_WITHER_HURT:0.3:2'

    # При получении урона
    - 'on_damage_taken:effect:DAMAGE_RESISTANCE:3:1'
    - 'on_damage_taken:particle:SMOKE_NORMAL:10'

    # При подборе
    - 'on_pickup:message:&8👁 &7Тени приветствуют нового хозяина!'
    - 'on_pickup:particle:PORTAL:20'
    - 'on_pickup:sound:ENTITY_ENDERMAN_TELEPORT:0.5:1.2'

    # При выбрасывании
    - 'on_drop:message:&8👁 &7Тени покидают клинок.'
    - 'on_drop:particle:SMOKE_NORMAL:15'
