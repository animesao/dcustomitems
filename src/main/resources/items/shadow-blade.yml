# ============================================
# ТЕНЬ КЛИНОК - Легендарный меч теней
# ============================================

shadow-blade:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: shadow.blade

  item:
    type: NETHERITE_SWORD
    title: '&8[⚔] &7Тень &8Клинок'
    glowing: true
    unbreakable: true
    custom-model-data: 1001
    enchantments:
      SHARPNESS: 6
      LOOTING: 3
      FIRE_ASPECT: 2
      DURABILITY: 3

  lore:
    - ''
    - ' &8━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Легендарный клинок теней'
    - ' &8━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fКогда в основной руке:'
    - ' &6┌ &eСила &8III &7(&6∞&7)'
    - ' &6└ &eСкорость &8II &7(&6∞&7)'
    - ''

  effects:
    - 'INCREASE_DAMAGE:3'
    - 'SPEED:2'

  attributes:
    GENERIC_ATTACK_DAMAGE: 8.0
    GENERIC_ATTACK_SPEED: 1.8
    GENERIC_MOVEMENT_SPEED: 0.15

  click-cooldown: 1500

  trigger-actions:
    # --- При экипировке ---
    - 'on_equip:particle:SMOKE_LARGE:25'
    - 'on_equip:particle:ENCHANTMENT_TABLE:20'
    - 'on_equip:particle:PORTAL:15'
    - 'on_equip:sound:ITEM_TRIDENT_RETURN:1:1.2'
    - 'on_equip:sound:ENTITY_ENDER_DRAGON_GROWL:0.3:1.5'
    - 'on_equip:message:&8👁 &7Вы чувствуете силу теней!'

    # --- При снятии ---
    - 'on_unequip:particle:SMOKE_NORMAL:15'
    - 'on_unequip:particle:CLOUD:10'
    - 'on_unequip:sound:ENTITY_ENDERMAN_TELEPORT:0.5:1.2'
    - 'on_unequip:message:&8👁 &7Тени покидают вас.'

    # --- При ПКМ ---
    - 'on_click_right:effect:INCREASE_DAMAGE:8:3'
    - 'on_click_right:effect:SPEED:8:2'
    - 'on_click_right:particle:SMOKE_LARGE:30'
    - 'on_click_right:particle:ENCHANTMENT_TABLE:20'
    - 'on_click_right:sound:ENTITY_ENDER_DRAGON_GROWL:0.5:1.5'
    - 'on_click_right:title:&8⚔ &7Активация теней!::&8Тени окружают вас!:10:40:10'
    - 'on_click_right:message:&8⚔ &7Тень Клинок активирован!'

    # --- При ЛКМ ---
    - 'on_click_left:lightning:2'
    - 'on_click_left:particle:EXPLOSION_HUGE:5'
    - 'on_click_left:sound:ENTITY_LIGHTNING_BOLT_IMPACT:1:1'
    - 'on_click_left:message:&8⚡ &7Молнии призваны!'

    # --- При убийстве ---
    - 'on_kill:heal:20'
    - 'on_kill:effect:REGENERATION:10:2'
    - 'on_kill:effect:INCREASE_DAMAGE:5:2'
    - 'on_kill:particle:HEART:25'
    - 'on_kill:particle:DRAGON_BREATH:15'
    - 'on_kill:sound:ENTITY_PLAYER_LEVELUP:1:1.5'
    - 'on_kill:message:&8💀 &7Враг повержен!'

    # --- При прыжке ---
    - 'on_jump:effect:SPEED:3:2'
    - 'on_jump:particle:SMOKE_NORMAL:10'
    - 'on_jump:sound:ENTITY_ENDERMAN_TELEPORT:0.3:1.5'

    # --- При нанесении урона ---
    - 'on_damage_dealt:particle:DRAGON_BREATH:8'
    - 'on_damage_dealt:sound:ENTITY_WITHER_HURT:0.3:2'

    # --- При получении урона ---
    - 'on_damage_taken:effect:DAMAGE_RESISTANCE:3:1'
    - 'on_damage_taken:particle:SMOKE_NORMAL:10'

    # --- При подборе ---
    - 'on_pickup:message:&8👁 &7Тени приветствуют нового хозяина!'
    - 'on_pickup:particle:PORTAL:20'
    - 'on_pickup:sound:ENTITY_ENDERMAN_TELEPORT:0.5:1.2'

    # --- При выбрасывании ---
    - 'on_drop:message:&8👁 &7Тени покидают клинок.'
    - 'on_drop:particle:SMOKE_NORMAL:15'
