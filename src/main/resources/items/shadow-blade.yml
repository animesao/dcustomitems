# ============================================
# ТЕНЕВОЙ КЛИНОК - Легендарный меч теней
# ============================================

shadow-blade:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: shadow.blade

  item:
    type: NETHERITE_SWORD
    title: '&8[⚔] &7Тень &8Клинок'
    glowing: true
    unbreakable: true
    item-model: "shadow_blade"
    enchantments:
      SHARPNESS: 6
      LOOTING: 3
      FIRE_ASPECT: 2
      UNBREAKING: 3

  lore:
    - ''
    - ' &8━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Легендарный клинок теней'
    - ' &8━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fКогда в основной руке:'
    - ' &6┌ &eСила &8III'
    - ' &6└ &eСкорость &8II'
    - ''

  effects:
    - 'INCREASE_DAMAGE:3'
    - 'SPEED:2'

  attributes:
    GENERIC_ATTACK_DAMAGE: 8.0
    GENERIC_ATTACK_SPEED: 1.8
    GENERIC_MOVEMENT_SPEED: 0.15

  click-cooldown: 1500
  cooldown-message: ""

  triggers:
    on_equip:
      - 'particles:SMOKE:25'
      - 'particles:ENCHANTMENT_TABLE:20'
      - 'particles:PORTAL:15'
      - 'sound:ITEM_TRIDENT_RETURN:1:1.2'

    on_unequip:
      - 'particles:SMOKE:15'
      - 'particles:CLOUD:10'
      - 'sound:ENTITY_ENDERMAN_TELEPORT:0.5:1.2'

    on_click_right:
      - 'effect:STRENGTH:8:3'
      - 'effect:SPEED:8:2'
      - 'particles:SMOKE:30'
      - 'particles:ENCHANTMENT_TABLE:20'
      - 'sound:ENTITY_ENDER_DRAGON_GROWL:0.5:1.5'
      - 'title:&8⚔ &7Активация теней!|&8Тени окружают вас!:10:40:10'

    on_click_left:
      - 'lightning:2'
      - 'particles:EXPLOSION_HUGE:5'
      - 'sound:ENTITY_LIGHTNING_BOLT_IMPACT:1:1'

    on_kill:
      - 'heal:20'
      - 'effect:REGENERATION:10:2'
      - 'effect:STRENGTH:5:2'
      - 'particles:HEART:25'
      - 'sound:ENTITY_PLAYER_LEVELUP:1:1.5'

    on_jump:
      - 'effect:SPEED:3:2'
      - 'particles:SMOKE:10'
      - 'sound:ENTITY_ENDERMAN_TELEPORT:0.3:1.5'

    on_damage_dealt:
      - 'particles:DRAGON_BREATH:8'
      - 'sound:ENTITY_WITHER_HURT:0.3:2'

    on_damage_taken:
      - 'effect:RESISTANCE:3:1'
      - 'particles:SMOKE:10'

    on_pickup:
      - 'particles:PORTAL:20'
      - 'sound:ENTITY_ENDERMAN_TELEPORT:0.5:1.2'

    on_drop:
      - 'particles:SMOKE:15'
