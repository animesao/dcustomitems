# ============================================
# ТОТЕМ ЗАЩИТЫ - Даёт поглощение и сопротивление
# ============================================
# 4 использования, каждый раз даёт:
# - Поглощение урона на 60 секунд
# - Сопротивление на 30 секунд
# ============================================

shield-totem:
  type: CONSUMABLE
  activation-slot: HAND
  placeable: false
  permission: totem.shield

  item:
    type: TOTEM_OF_UNDYING
    title: '&9[🛡] &fТотем &9Защиты'
    glowing: true
    unbreakable: false
    item-model: "shield_totem"
    amount: 1

  lore:
    - ''
    - ' &9━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Тотем древней защиты'
    - ' &9━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &9🛡 &fПКМ: Активировать'
    - ' &7Даёт Absorption на 60 секунд'
    - ' &7Даёт Resistance на 30 секунд'
    - ''
    - ' &eОсталось активаций: &9%uses% &7из &44'
    - ''

  max-uses: 4

  uses-depleted-message: '&9❌ Тотем разрушился!'

  activation-message: '&9🛡 Тотем активирован!'

  trigger-actions:
    # При ПКМ - защита
    - 'on_click_right:effect:ABSORPTION:60:2'
    - 'on_click_right:effect:RESISTANCE:30:1'
    - 'on_click_right:remove:TOTEM_OF_UNDYING:1'
    - 'on_click_right:particle:TOTEM:80'
    - 'on_click_right:particle:ENCHANTMENT_TABLE:30'
    - 'on_click_right:sound:ITEM_TOTEM_USE:1:1'
    - 'on_click_right:sound:ENTITY_PLAYER_LEVELUP:0.5:1.5'
    - 'on_click_right:title:&9🛡 &fЗАЩИТА АКТИВИРОВАНА!::&aAbsorption + Resistance!:10:40:10'
    - 'on_click_right:message:&9🛡 &7Вы активировали Тотем Защиты! &aПолная защита!'

    # При подборе
    - 'on_pickup:message:&9🛡 &7Тотем Защиты подобран!'
    - 'on_pickup:particle:TOTEM:30'

    # При выбрасывании
    - 'on_drop:message:&9🛡 &7Тотем выброшен.'
