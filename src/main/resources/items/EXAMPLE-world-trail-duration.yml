# ============================================
# 🔥 FIERY BLADE — Demo of the new features
# ============================================
# Demonstrates:
#   • duration (timer — the item disappears after 60 sec)
#   • trail-particles (fiery trail while moving)
#   • allowed-worlds / disabled-worlds (world restrictions)
#   • item-model-variant (animated texture)
#   • on_sprint trigger (effect when sprint starts)
# ============================================

flame-blade-demo:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: demo.flame

  # ⏱️ Timer: the item lives for 60 seconds, then disappears
  duration: 60
  max-duration-message: '&c🔥 The blade melted!'

  # 🌍 World restrictions
  allowed-worlds:
    - world
    - world_nether
  disabled-worlds:
    - world_the_end

  # ✨ Trail particles (fiery trail)
  trail-particles:
    - 'FLAME:6'
    - 'LAVA:2'
  trail-particle-interval: 3  # every 3 ticks

  item:
    type: NETHERITE_SWORD
    title: '&c🔥 Fiery Blade &7(demo)'
    glowing: true
    unbreakable: true
    item-model: 'minecraft:item/netherite_sword'
    item-model-variant: 'flame_sword_animated'  # animated model
    enchantments:
      SHARPNESS: 5
      FIRE_ASPECT: 2

  lore:
    - ''
    - ' &4━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Fiery blade from the underworld'
    - ' &4━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⏱ &fLifetime: &c60 seconds'
    - ' &e🌍 &fWorlds: &aworld, &bnether'
    - ' &e🔥 &fTrail: &cfire + lava'
    - ''
    - ' &6⚡ &fWhile in main hand:'
    - ' &6┌ &eStrength &cIII'
    - ' &6├ &eSpeed &cII'
    - ' &6└ &cFire Resistance'
    - ''
    - '&e🏃 &fStart sprinting — get a bonus!'
    - ''

  effects:
    - 'INCREASE_DAMAGE:3'
    - 'SPEED:2'
    - 'FIRE_RESISTANCE:1'

  attributes:
    GENERIC_ATTACK_DAMAGE: 10.0
    GENERIC_ATTACK_SPEED: 1.6

  click-cooldown: 2000

  triggers:
    on_equip:
      - 'particles_custom:FLAME:50:0:1:0:2:2:2'
      - 'sound:ENTITY_BLAZE_AMBIENT:1:1'
      - 'title:&c🔥 Fiery Blade!|||10:40:10'

    on_unequip:
      - 'particles:SMOKE:15'
      - 'sound:ENTITY_ENDER_DRAGON_GROWL:0.5:1.5'

    # 🏃 New trigger: when sprint starts
    on_sprint:
      - 'effect:SPEED:3:1'
      - 'particles:FLAME:8'
      - 'sound:ENTITY_BLAZE_SHOOT:0.3:1.5'

    on_click_right:
      - 'effect:STRENGTH:8:3'
      - 'effect:SPEED:8:2'
      - 'particles_custom:FLAME:80:0:1:0:3:2:3'
      - 'sound:ENTITY_BLAZE_SHOOT:1:1'
      - 'title:&c🔥 FIERY STRIKE!|||10:40:10'

    on_click_left:
      - 'damage_nearby:25:4'
      - 'knockback:4'
      - 'particles_custom:EXPLOSION_HUGE:20:0:1:0:3:3:3'
      - 'sound:ENTITY_GENERIC_EXPLODE:1:1'

    on_kill:
      - 'heal:30'
      - 'effect:REGENERATION:10:2'
      - 'particles_custom:HEART:40:0:2:0:2:2:2'
      - 'sound:ENTITY_PLAYER_LEVELUP:1:2'

    on_damage_dealt:
      - 'particles:CRIT:10'
      - 'sound:ENTITY_BLAZE_SHOOT:0.3:2'

    on_damage_taken:
      - 'effect:RESISTANCE:5:1'
      - 'particles:SMOKE:8'

    on_jump:
      - 'effect:SPEED:3:1'
      - 'particles:FLAME:5'

