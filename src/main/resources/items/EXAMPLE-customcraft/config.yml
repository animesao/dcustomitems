# ============================================
# 🛠 CustomCraft — GUI-крафт кастомных предметов
# ============================================
# Модуль: кастомный крафт через виртуальный верстак.
# Берёт рецепты из YAML-секции `recipes` всех кастомных предметов
# (shaped / shapeless) и позволяет скрафтить их в GUI.
#
# Идентичность предметов — по PDC (PersistentDataContainer / NBT):
#   - кастомные предметы матчатся по их ID (не по названию/материалу);
#   - ингредиенты других плагинов — по материалу, их NBT не портится;
#   - готовый предмет получает корректные uses/duration через ItemHandler.
#
# Отключение: удалите папку items/customcraft/ или enabled: false.

name: "CustomCraft"
version: "1.0"
enabled: true

# Команда модуля
command: craft

# Права (пусто = без ограничений)
permission: dci.craft

# Настройки GUI
gui:
  # Название окна
  title: "&8\u2692 CustomCraft"
  # Материал фона
  filler: GRAY_STAINED_GLASS_PANE
  # Слот результата (в 27-слотовом сундуке)
  result-slot: 22
  # Вернуть предметы из сетки при закрытии окна
  return-items-on-close: true

# Сообщения
messages:
  no-recipes: "&cУ вас нет доступных рецептов."
  no-permission: "&cУ вас нет прав на /craft!"
  crafted: "&aПредмет скрафчен!"
  inventory-full: "&cИнвентарь полон!"
