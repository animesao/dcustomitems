# ============================================

fire-resistance-potion:
  type: CONSUMABLE
  activation-slot: HAND
  placeable: false
  permission: potion.fire_resistance

  item:
    type: GLASS_BOTTLE
    title: '&c[🔥] &fЗелье &cОгнестойкости'
    glowing: true
    unbreakable: false
    item-model: "fire_resistance_potion"
    amount: 1

  lore:
    - ''
    - ' &c━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Зелье огненной защиты'
    - ' &c━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &c🔥 &fПКМ: Выпить'
    - ' &7Даёт Огнестойкость на 60 секунд'
    - ''
    - ' &eОсталось глотков: &c%uses% &7из &43'
    - ''

  max-uses: 3
  uses-depleted-message: ""
  cooldown-message: ""
  equip-message: ""
  unequip-message: ""

  click-cooldown: 500

  triggers:
    on_click_right:
      - 'effect:FIRE_RESISTANCE:60:1'
      - 'particles:FLAME:60'
      - 'particles:LAVA:30'
      - 'sound:ENTITY_PLAYER_BURP:1:1'

    on_pickup:
      - 'particles:FLAME:10'

    on_drop:
      - 'particles:SMOKE:5'
