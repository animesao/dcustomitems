# ============================================
# ТАЛИСМАН ПРИРОДЫ - Одноразовый предмет
# ============================================

nature-talisman:
  type: CONSUMABLE
  activation-slot: HAND
  placeable: false
  permission: nature.talisman

  item:
    type: PAPER
    title: '&a[🌿] &fТалисман &aПрироды'
    glowing: true
    unbreakable: false
    item-model: "nature_talisman"
    amount: 1

  lore:
    - ''
    - ' &2━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Древний талисман природы'
    - ' &2━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &a🌿 &fПКМ: Активировать'
    - ' &7Даёт регенерацию на 30 секунд'
    - ''
    - ' &c⚠ Одноразовый предмет!'
    - ' &7Осталось использований: &a%uses%'
    - ''

  max-uses: 1
  uses-depleted-message: ""
  cooldown-message: ""
  equip-message: ""
  unequip-message: ""

  click-cooldown: 500

  triggers:
    on_click_right:
      - 'effect:REGENERATION:30:2'
      - 'heal:10'
      - 'particles:VILLAGER_HAPPY:50'
      - 'sound:ENTITY_PLAYER_LEVELUP:1:1.5'

    on_pickup:
      - 'particles:VILLAGER_HAPPY:10'

    on_drop:
      - 'particles:SMOKE:5'
