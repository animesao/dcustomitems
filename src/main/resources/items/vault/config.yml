# ==========================================
# 💰 Vault Economy Module
# ==========================================
#
# Модуль экономики для DC-CustomItems.
# Позволяет покупать и продавать кастомные предметы за виртуальную валюту.
#
# Требования:
#   - Vault (плагин)
#   - Плагин экономики (EssentialsX, ChargeMe, и т.д.)
#
# Отключение:
#   Установите enabled: false или удалите папку items/vault/
#
# ==========================================

name: "Vault Economy"
version: "1.0"
enabled: true

# Настройки магазина
shop:
  # Разрешить покупку предметов
  buy-enabled: true
  # Разрешить продажу предметов
  sell-enabled: true
  # Максимальное количество за одну покупку
  max-amount: 64
  # Сообщение при недостатке средств
  insufficient-funds: "&c[DCI] &cНедостаточно средств! Нужно: &e{price} &c| У вас: &e{balance}"
  # Сообщение при успешной покупке
  buy-success: "&a[DCI] &aВы купили &e{item} x{amount} &aза &e{price}&a!"
  # Сообщение при успешной продаже
  sell-success: "&a[DCI] &aВы продали &e{item} x{amount} &aза &e{price}&a!"
  # Сообщение если предмет нельзя купить
  not-buyable: "&c[DCI] &cЭтот предмет нельзя купить!"
  # Сообщение если предмет нельзя продать
  not-sellable: "&c[DCI] &cЭтот предмет нельзя продать!"
  # Сообщение если инвентарь полон
  inventory-full: "&c[DCI] &cИнвентарь полон!"
  # Сообщение если нет предметов для продажи
  nothing-to-sell: "&c[DCI] &cУ вас нет этого предмета!"

# Команды модуля
commands:
  - buy
  - sell

# Права модуля
permissions:
  - dci.buy
  - dci.sell
