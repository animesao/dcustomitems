# ==========================================
# 💰 Vault Economy Module
# ==========================================
#
# A simple player currency (Essentials-style) — without a shop.
#
# Commands:
#   /balance (aliases /bal /money), /pay, /eco (admin)
#
# Buying/selling items — those are separate plugins (shop, auction
# etc.) that work with the module's currency through Vault or the public
# API: getBalance / withdraw / deposit / format.
#
# Requirements:
#   - Vault (plugin)
#   - An economy plugin (EssentialsX, ChargeMe etc.)
#
# Disabling:
#   Set enabled: false or delete the items/vault/ folder
#
# ==========================================

name: "Vault Economy"
version: "2.0"
enabled: true

# ==========================================
# 💵 ECONOMY (Essentials-style)
# ==========================================
economy:
  # Where to store the balances:
  #   vault — the Vault economy (Vault + an economy plugin such as EssentialsX are required)
  #   own   — the plugin's OWN DATABASE (data.db SQLite or MySQL from the core config.yml).
  #           NO Vault economy plugin is required. Balances are stored in the
  #           dci_vault_balances table, all operations are written to the dci_vault_transactions log.
  storage: vault

  currency-symbol: "$"         # currency symbol (for storage: own)
  currency-name: "dollar"      # currency name, singular (%vault_currency_singular%)
  currency-name-plural: "dollars"  # plural (%vault_currency%)

  # Starting balance for a new player (0 = disabled).
  # storage: own  → the row in dci_vault_balances is created right away with the starting amount
  # storage: vault → the list of those who received it — items/vault/starting-paid.yml
  starting-balance: 0

  pay-enabled: true          # allow /pay
  min-pay: 1.0               # minimum transfer amount
  insufficient-funds: "&c[DCI] &cInsufficient funds! Needed: &e{price} &c| You have: &e{balance}"

  players-only: "&c[DCI] &cPlayers only!"
  no-permission: "&c[DCI] &cNo permission!"
  economy-not-loaded: "&c[DCI] &cThe economy is not connected! Install Vault + an economy plugin."
  transaction-error: "&c[DCI] &cTransaction error!"
  player-not-found: "&c[DCI] &cPlayer '&e{player}&c' not found."

  balance-own: "&a[DCI] &aYour balance: &e{balance}"
  balance-others: "&a[DCI] &aBalance of the player &e{player}&a: &e{balance}"

  pay-usage: "&c[DCI] &cUsage: /pay <player> <amount>"
  pay-disabled: "&c[DCI] &cTransfers are disabled!"
  pay-offline: "&c[DCI] &cThe player must be online!"
  pay-self: "&c[DCI] &cYou cannot transfer to yourself!"
  pay-min: "&c[DCI] &cMinimum transfer amount: &e{min}"
  pay-sent: "&a[DCI] &aYou transferred &e{amount} &ato the player &e{player}&a. Balance: &e{balance}"
  pay-received: "&a[DCI] &e{player} &atransferred you &e{amount}&a. Balance: &e{balance}"

  eco-usage: "&c[DCI] &cUsage: /eco <give|take|set|reset> <player> [amount]"
  eco-done: "&a[DCI] &aBalance &e{player}&a: &e{balance}"

  starting-balance-given: "&a[DCI] &aYou have been credited with the starting balance: &e{amount}"

# Module commands (for reference; they are registered automatically)
commands:
  - balance
  - bal
  - money
  - pay
  - eco

# Module permissions
# For players (by default everyone): dci.balance, dci.balance.others, dci.pay
# For admins (by default OP): dci.eco
permissions:
  - dci.balance
  - dci.balance.others
  - dci.pay
  - dci.eco