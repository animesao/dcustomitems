# ============================================
# ПРИМЕР КРАФТ-РЕЦЕПТОВ
# ============================================
# Файл начинается с EXAMPLE- и НЕ копируется на сервер автоматически.
# Скопируйте нужную часть в свой предмет, чтобы получить рецепты.
#
# Рецепты задаются в секции recipes самого предмета.
# Ингредиент: материал (DIAMOND, STICK...) ИЛИ id другого кастомного предмета.
#
# ВАЖНО: результат крафта — сам предмет (со всеми его механиками).
# После изменения рецептов выполните /ci reload.

my-crafted-sword:
  type: TOOL
  activation-slot: HAND

  item:
    type: DIAMOND_SWORD
    title: '&bКрафтовый Меч'
    glowing: true

  # ---- Крафт в верстаке (форма) ----
  recipes:
    shaped:
      - pattern:
          - " A "
          - "ABA"
          - " A "
        # A = алмаз, B = палка. Пробел = пустая ячейка.
        keys:
          A: DIAMOND
          B: STICK
        amount: 1

    # ---- Крафт без формы (любое расположение) ----
    shapeless:
      - ingredients:
          - DIAMOND
          - DIAMOND
          - my-crafted-sword   # ингредиентом может быть другой кастомный предмет!
        amount: 1

    # ---- Переплавка в печи ----
    furnace:
      - ingredient: IRON_INGOT
        experience: 0.7
        cooking-time: 200      # тики (200 = 10 сек)
