# ============================================
# CRAFTING RECIPE EXAMPLE
# ============================================
# The file starts with EXAMPLE- — it is a sample: it is copied into items/ on
# first launch but is not loaded. To enable it — remove the EXAMPLE- prefix
# from the file name or copy the part you need into your own item.
#
# Recipes are defined in the recipes section of the item itself.
# Ingredient: a material (DIAMOND, STICK...) OR the id of another custom item.
#
# IMPORTANT: the crafting result is the item itself (with all of its mechanics).
# Run /ci reload after changing recipes.

my-crafted-sword:
  type: TOOL
  activation-slot: HAND

  item:
    type: DIAMOND_SWORD
    title: '&bCrafted Sword'
    glowing: true

  # ---- Crafting in a crafting table (shaped) ----
  recipes:
    shaped:
      - pattern:
          - " A "
          - "ABA"
          - " A "
        # A = diamond, B = stick. A space = an empty slot.
        keys:
          A: DIAMOND
          B: STICK
        amount: 1

    # ---- Crafting without a shape (any arrangement) ----
    shapeless:
      - ingredients:
          - DIAMOND
          - DIAMOND
          - my-crafted-sword   # an ingredient can be another custom item!
        amount: 1

    # ---- Smelting in a furnace ----
    furnace:
      - ingredient: IRON_INGOT
        experience: 0.7
        cooking-time: 200      # ticks (200 = 10 sec)
