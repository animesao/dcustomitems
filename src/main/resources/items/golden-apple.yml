# ============================================
# ЗОЛОТОЕ ЯБЛОКО - Даёт множество эффектов
# ============================================

golden-apple:
  type: CONSUMABLE
  activation-slot: HAND
  placeable: false
  permission: item.golden_apple

  item:
    type: GOLDEN_APPLE
    title: '&6[✨] &fЗолотое &6Яблоко'
    glowing: true
    unbreakable: false
    item-model: "golden_apple"
    amount: 1

  lore:
    - ''
    - ' &6━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Яблоко из чистого золота'
    - ' &6━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &6✨ &fПКМ: Съесть'
    - ' &7Восстанавливает 8 HP'
    - ' &7Даёт Regeneration, Absorption, Resistance'
    - ''
    - ' &eОсталось кусочков: &6%uses% &7из &42'
    - ''

  max-uses: 2
  uses-depleted-message: ""
  cooldown-message: ""
  equip-message: ""
  unequip-message: ""

  click-cooldown: 500

  triggers:
    on_click_right:
      - 'heal:8'
      - 'effect:REGENERATION:15:2'
      - 'effect:ABSORPTION:30:1'
      - 'effect:RESISTANCE:15:1'
      - 'particles:FLAME:50'
      - 'particles:HEART:30'
      - 'particles:VILLAGER_HAPPY:40'
      - 'sound:ENTITY_PLAYER_BURP:1:1'

    on_pickup:
      - 'particles:FLAME:15'

    on_drop:
      - 'particles:SMOKE:5'
