# ============================================
# BLADE OF DESTINY - Ultimate weapon
# ============================================

artifact-blade-of-destiny:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: artifact.blade_of_destiny

  item:
    type: NETHERITE_SWORD
    title: '&6[⚔] &fBlade &6of Destiny'
    glowing: true
    unbreakable: true
    item-model: "blade_of_destiny"
    enchantments:
      SHARPNESS: 10
      FIRE_ASPECT: 2
      SWEEPING_EDGE: 3
      UNBREAKING: 3
      MENDING: 1

  lore:
    - ''
    - ' &6━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Ultimate weapon'
    - ' &6━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fWhile in main hand:'
    - ' &6┌ &eStrength &6V'
    - ' &6├ &eSpeed &6III'
    - ' &6└ &eRegeneration &6III'
    - ''
    - '&6⚔ &fRight Click: ULTIMATE STRIKE!'
    - ''

  effects:
    - 'INCREASE_DAMAGE:5'
    - 'SPEED:3'
    - 'REGENERATION:3'

  attributes:
    GENERIC_ATTACK_DAMAGE: 20.0
    GENERIC_ATTACK_SPEED: 2.0
    GENERIC_MAX_HEALTH: 10.0

  click-cooldown: 3000
  cooldown-message: ""

  triggers:
    on_equip:
      - 'particles:FLAME:40'
      - 'particles:ENCHANTMENT_TABLE:30'
      - 'sound:ENTITY_PLAYER_LEVELUP:1:2'

    on_unequip:
      - 'particles:SMOKE:15'

    on_click_right:
      - 'damage_nearby:30:6'
      - 'effect:STRENGTH:15:5'
      - 'effect:SPEED:15:3'
      - 'effect:REGENERATION:15:3'
      - 'lightning_forward:100'
      - 'particles:FLAME:80'
      - 'particles:EXPLOSION_HUGE:10'
      - 'sound:ENTITY_ENDER_DRAGON_GROWL:1:1'
      - 'title:&6⚔ &7ULTIMATE STRIKE!|&6All enemies destroyed!:10:60:10'

    on_click_left:
      - 'damage_nearby:25:5'
      - 'knockback:6'
      - 'particles:FLAME:50'
      - 'particles:EXPLOSION_LARGE:8'
      - 'sound:ENTITY_GENERIC_EXPLODE:1:1'

    on_kill:
      - 'heal:50'
      - 'effect:REGENERATION:20:4'
      - 'effect:STRENGTH:15:5'
      - 'effect:SPEED:15:3'
      - 'particles:HEART:40'
      - 'sound:ENTITY_PLAYER_LEVELUP:1:2'

    on_damage_dealt:
      - 'heal:10'
      - 'particles:FLAME:15'

    on_damage_taken:
      - 'effect:RESISTANCE:8:3'
      - 'effect:REGENERATION:5:3'
      - 'particles:ENCHANTMENT_TABLE:10'

    on_pickup:
      - 'particles:ENCHANTMENT_TABLE:25'
      - 'sound:ENTITY_PLAYER_LEVELUP:1:2'

    on_drop:
      - 'particles:SMOKE:15'
