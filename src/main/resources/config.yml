# ==========================================
# ПРИМЕР ПРЕДМЕТА С PER-ITEM СООБЩЕНИЯМИ
# ==========================================
# Все сообщения можно настроить для каждого предмета отдельно.
# Если per-item сообщение не задано, используется глобальное из messages.yml.
#
# Доступные per-item сообщения:
#   equip-message: Сообщение при экипировке
#   unequip-message: Сообщение при снятии
#   cooldown-message: Сообщение при кулдауне
#   activation-message: Сообщение при активации эффектов
#   deactivation-message: Сообщение при деактивации
#   uses-depleted-message: Сообщение при исчерпании использований
#
# Плейсхолдеры в per-item сообщениях:
#   {item} - ID предмета
#   {player} - Имя игрока
#   {seconds} - Секунды кулдауна
#   {uses} - Оставшиеся использования
#
example-custom-messages:
  item:
    type: DIAMOND_SWORD
    title: '&c[⚔] &fМеч с Сообщениями'
    glowing: true
    unbreakable: true
  lore:
    - ''
    - ' &7Когда в основной руке:'
    - ' &6┌ &e⇄ &fСила &cIII &7(&6∞&7)'
    - ' &6└ &e⇄ &fСкорость &cII &7(&6∞&7)'
    - ''
    - '&7Использования: &b%uses%'
    - '&7Кулдаун: &b%cooldown% сек.'
    - ''
  type: TOOL
  activation-slot: HAND
  placeable: false
  click-cooldown: 3000
  max-uses: 50
  effects:
    - 'INCREASE_DAMAGE:3'
    - 'SPEED:2'
  # Per-item сообщения (переопределяют глобальные)
  equip-message: '&a⚔ Меч извлечен! Сила активирована!'
  unequip-message: '&c⚔ Меч убран в ножны.'
  cooldown-message: '&c⏳ Подождите {seconds} сек. перед следующим ударом!'
  activation-message: '&a✨ Эффекты меча активированы!'
  deactivation-message: '&c💤 Эффекты меча деактивированы.'
  uses-depleted-message: '&c⚔ Меч сломался! Использования исчерпаны!'
