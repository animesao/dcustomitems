# ПРИМЕРЫ ПРЕДМЕТОВ С НОВЫМИ ФУНКЦИЯМИ
# ==========================================
#
# Доступные параметры:
#   custom-model-data: <число> - ID модели для ресурспаков
#   permission: <строка> - Право на использование предмета
#   equip-particles: <частица:кол-во> - Частицы при экипировке
#   equip-sounds: <звук:громкость:тональность> - Звуки при экипировке
#   unequip-particles: <частица:кол-во> - Частицы при снятии
#   unequip-sounds: <звук:громкость:тональность> - Звуки при снятии
#   trigger-actions: - Действия при определенных событиях
#     - 'on_damage_taken:...' - При получении урона
#     - 'on_damage_dealt:...' - При нанесении урона
#     - 'on_kill:...' - При убийстве моба/игрока
#     - 'on_jump:...' - При прыжке
#     - 'on_death:...' - При смерти
#
