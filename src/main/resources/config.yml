# ==========================================
# DC-CustomItems - Plugin settings
# ==========================================
#
# All items live in separate files in the items/ folder.
# Each item (or group of items) is a separate file (.yml / .java).
#
# A fresh install contains exactly one file: items/messages.java.
# The examples are kept in the repository (samples/), not in the plugin.
#
# ==========================================

# ==========================================
# SECURITY: RUNTIME JAVA COMPILATION
# ==========================================
# The plugin compiles .java files from items/ right on the server (Java API).
# This executes arbitrary code: anyone who can write a file into items/
# gains control over the server. It is convenient on an admin server;
# turn it off if untrusted people can write to the plugin folder.
# With false all .java files AND .jar files in items/ are ignored
# (YAML items still work).
java-compilation: true

# Debug logging (turn off in production)
debug-mode: false

# Plugin logs to plugins/DC-CustomItems/logs/latest.log instead of the console.
# Disabled by default - the plugin messages go to the server console.
file-logging: false

# Backups of items/ + config.yml + data.db before every /ci reload.
backup:
  on-reload: true
  keep: 5

# ==========================================
# CONTENT
# ==========================================
# The plugin installs exactly ONE file: plugins/DC-CustomItems/items/messages.java
# (all plugin messages, editable by you).
#
# Everything else is optional and created by you:
#   - .yml  - items (delete a file = the item is gone)
#   - .java - commands and Java items (delete a file = the command is gone)
#   - folders - modules (delete a folder = the module is disabled)
#
# Ready-made examples are NOT installed and are not shipped inside the jar.
# They live in the repository (samples/) — copy the file or folder you need
# into items/ and remove the EXAMPLE- prefix from its name, then run
# /ci reload.
#
#   EXAMPLE-runes.yml -> runes.yml
#   EXAMPLE-vault/    -> vault/
#
# ==========================================

# ==========================================
# DATABASE
# ==========================================
# A local SQLite file (data.db) is used by default.
# For MySQL change type to mysql and fill in the credentials.
# Restart the server after changing database.type.
database:
  type: sqlite # sqlite or mysql
  mysql:
    host: 127.0.0.1
    port: 3306
    database: dcustomitems
    username: dcustomitems
    password: 'change-me'
    use-ssl: false
    pool-size: 5
    connection-timeout-ms: 5000
    leak-detection-ms: 0

# ==========================================
# SET BONUSES (for full armor sets)
# ==========================================
# They are defined here because ArmorSetManager reads from config.yml.
# Every set ID must match the armor-set value in the armor YAML files.
set-bonuses:
  dark-lord:
    effects:
      - 'INCREASE_DAMAGE:3'
      - 'SPEED:2'
      - 'REGENERATION:2'

# ==========================================
# ATTRIBUTE REFERENCE
# ==========================================
#
# Plain value (ADD_NUMBER):
#   attributes:
#     GENERIC_ATTACK_DAMAGE: 2.0
#
# Legacy names (GENERIC_*/PLAYER_*) and modern names (attack_damage)
# are both supported.
#
# Attribute operations:
#   ADD_NUMBER      - add to the base value
#   MULTIPLY_BASE   - multiply the base value
#   MULTIPLY_TOTAL  - multiply the final value
#
# FULL LIST OF ATTRIBUTES:
# ========================
# GENERIC_MAX_HEALTH              - Max health
# GENERIC_FOLLOW_RANGE           - Mob follow range
# GENERIC_KNOCKBACK_RESISTANCE   - Knockback resistance
# GENERIC_MOVEMENT_SPEED         - Movement speed
# GENERIC_FLYING_SPEED          - Flying speed
# GENERIC_ATTACK_DAMAGE         - Attack damage
# GENERIC_ATTACK_KNOCKBACK      - Knockback on attack
# GENERIC_ATTACK_SPEED          - Attack speed
# GENERIC_ARMOR                 - Armor
# GENERIC_ARMOR_TOUGHNESS       - Armor toughness
# GENERIC_FALL_DAMAGE_MULTIPLIER - Fall damage multiplier
# GENERIC_LUCK                  - Luck
# GENERIC_MAX_ABSORPTION        - Max absorption
# GENERIC_SAFE_FALL_DISTANCE    - Safe fall distance
# GENERIC_SCALE                 - Entity scale
# GENERIC_STEP_HEIGHT           - Step height
# GENERIC_GRAVITY               - Gravity
# GENERIC_JUMP_STRENGTH         - Jump strength
# GENERIC_BURNING_TIME          - Burning time
# GENERIC_EXPLOSION_KNOCKBACK_RESISTANCE - Explosion knockback resistance
# GENERIC_MOVEMENT_EFFICIENCY   - Movement efficiency
# GENERIC_OXYGEN_BONUS         - Oxygen bonus
# GENERIC_WATER_MOVEMENT_EFFICIENCY - Water movement efficiency
# PLAYER_BLOCK_INTERACTION_RANGE - Block interaction range
# PLAYER_ENTITY_INTERACTION_RANGE - Entity interaction range
# PLAYER_BLOCK_BREAK_SPEED     - Block break speed
# PLAYER_MINING_EFFICIENCY     - Mining efficiency
# PLAYER_SNEAKING_SPEED        - Sneaking speed
# PLAYER_SUBMERGED_MINING_SPEED - Submerged mining speed
# PLAYER_SWEEPING_DAMAGE_RATIO - Sweeping damage ratio
# ZOMBIE_SPAWN_REINFORCEMENTS  - Zombie spawn reinforcements
