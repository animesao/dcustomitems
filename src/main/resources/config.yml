    - '&6✦ &fНаносит &c4x &fурона'
    - '&6✦ &fПри убийстве восстанавливает здоровье'
    - ''
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: legendary.sword
  equip-particles:
    - 'FLAME:20'
    - 'ENCHANTMENT_TABLE:15'
