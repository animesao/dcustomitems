# ==========================================
# DC-CustomItems - Настройки плагина
# ==========================================
#
# Все предметы теперь находятся в отдельных YAML-файлах в папке items/.
# Каждый предмет или группа предметов — отдельный файл (.yml).
#
# Структура предметов:
#   items/
#   ├── runes.yml            — Руны и шары
#   ├── armor.yml            — Броня (сеты)
#   ├── tools.yml            — Оружие и инструменты
#   ├── totems.yml           — Тотемы бессмертия
#   ├── advanced.yml         — Продвинутые предметы
#   ├── health-potion.yml    — Зелья
#   ├── vampire-blade.yml    — Кастомные мечи
#   ├── shop/                — Модуль магазина
#   └── deluxemenux/         — Модуль GUI-меню
#
# ==========================================

# Отключите, если не хотите, чтобы штатные модули копировались автоматически.
extract-default-modules: true

# ==========================================
# БЕЗОПАСНОСТЬ: RUNTIME-КОМПИЛЯЦИЯ JAVA
# ==========================================
# Плагин компилирует .java-файлы из items/ прямо на сервере (Java API).
# Это выполнение произвольного кода: любой, кто может записать файл в
# items/, получает контроль над сервером. На админ-сервере это удобно;
# если доступ к файлам плагина есть у недоверенных лиц — выключите.
# При false все .java-файлы в items/ игнорируются (YAML-предметы работают).
java-compilation: true

# Отладочное логирование (выключить в продакшене)
debug-mode: false

# ==========================================
# ШТАТНЫЕ МОДУЛИ
# ==========================================
# При первом запуске плагин копирует штатные модули и предметы из jar
# в папку items/ (только отсутствующие файлы, ничего не перезаписывая).
#
# Вся функциональность живёт в items/ как файлы:
#   - .yml  — предметы (удали файл = предмет исчез)
#   - .java — команды и Java-предметы (удали файл = команда исчезла)
#   - папки — модули vault/, shop/, deluxemenux/ (удали папку = модуль отключён)
#
# Отключите, если не хотите, чтобы штатные модули копировались автоматически.
extract-default-modules: true

# ==========================================
# БАЗА ДАННЫХ
# ==========================================
# По умолчанию используется локальный SQLite-файл data.db.
# Для MySQL измените type на mysql и заполните credentials.
# После изменения database.type перезапустите сервер.
database:
  type: sqlite # sqlite или mysql
  mysql:
    host: 127.0.0.1
    port: 3306
    database: dcustomitems
    username: dcustomitems
    password: 'change-me'
    use-ssl: false
    pool-size: 5
    connection-timeout-ms: 5000
    leak-detection-ms: 0

# ==========================================
# СЕТ-БОНУСЫ (для полных комплектов брони)
# ==========================================
# Определяются здесь, т.к. ArmorSetManager читает из config.yml.
# Каждый ID сета должен совпадать с armor-set в YAML-файлах брони.
set-bonuses:
  dark-lord:
    effects:
      - 'INCREASE_DAMAGE:3'
      - 'SPEED:2'
      - 'REGENERATION:2'

# ==========================================
# СПИСОК АТРИБУТОВ (справочник)
# ==========================================
#
# Простое значение (ADD_NUMBER):
#   attributes:
#     GENERIC_ATTACK_DAMAGE: 2.0
#
# С указанием операции:
#   attributes:
#     GENERIC_ATTACK_DAMAGE:
#       value: 2.0
#       operation: ADD_NUMBER
#
# Операции атрибутов:
#   ADD_NUMBER      - Добавить к базовому значению
#   MULTIPLY_BASE   - Умножить базовое значение
#   MULTIPLY_TOTAL  - Умножить итоговое значение
#
# ПОЛНЫЙ СПИСОК АТРИБУТОВ:
# ========================
# GENERIC_MAX_HEALTH              - Макс. здоровье
# GENERIC_FOLLOW_RANGE           - Дистанция следования мобов
# GENERIC_KNOCKBACK_RESISTANCE   - Сопротивление отбросу
# GENERIC_MOVEMENT_SPEED         - Скорость передвижения
# GENERIC_FLYING_SPEED          - Скорость полёта
# GENERIC_ATTACK_DAMAGE         - Урон атаки
# GENERIC_ATTACK_KNOCKBACK      - Отброс при атаке
# GENERIC_ATTACK_SPEED          - Скорость атаки
# GENERIC_ARMOR                 - Броня
# GENERIC_ARMOR_TOUGHNESS       - Прочность брони
# GENERIC_FALL_DAMAGE_MULTIPLIER - Множитель урона от падения
# GENERIC_LUCK                  - Удача
# GENERIC_MAX_ABSORPTION        - Макс. поглощение урона
# GENERIC_SAFE_FALL_DISTANCE    - Безопасная дистанция падения
# GENERIC_SCALE                 - Размер сущности
# GENERIC_STEP_HEIGHT           - Высота шага
# GENERIC_GRAVITY               - Гравитация
# GENERIC_JUMP_STRENGTH         - Сила прыжка
# GENERIC_BURNING_TIME          - Время горения
# GENERIC_EXPLOSION_KNOCKBACK_RESISTANCE - Сопр. отбросу от взрывов
# GENERIC_MOVEMENT_EFFICIENCY   - Эффективность движения
# GENERIC_OXYGEN_BONUS         - Бонус кислорода
# GENERIC_WATER_MOVEMENT_EFFICIENCY - Скорость в воде
# PLAYER_BLOCK_INTERACTION_RANGE - Дистанция взаимодействия с блоками
# PLAYER_ENTITY_INTERACTION_RANGE - Дистанция взаимодействия с сущностями
# PLAYER_BLOCK_BREAK_SPEED     - Скорость добычи блоков
# PLAYER_MINING_EFFICIENCY     - Эффективность добычи
# PLAYER_SNEAKING_SPEED        - Скорость кражи
# PLAYER_SUBMERGED_MINING_SPEED - Скорость добычи под водой
# PLAYER_SWEEPING_DAMAGE_RATIO - Урон размаха
# ZOMBIE_SPAWN_REINFORCEMENTS  - Шанс подкрепления зомби
