    - 'ITEM_TRIDENT_RETURN:1:1.2'
  unequip-particles:
    - 'SMOKE_NORMAL:10'
  unequip-sounds:
    - 'ITEM_TRIDENT_HIT:0.8:0.8'
  effects:
