#   <id>:
#     title: "Заголовок"
#     size: 27  # 9, 18, 27, 36, 45, 54
#     fill:
#       material: GRAY_STAINED_GLASS_PANE
#       name: " "
#     items:
#       <slot>:
#         material: DIAMOND
#         name: "&bАлмаз"
#         lore:
#           - "&7Описание"
#         command: "give %player% diamond 1"
#         message: "&aВы купили алмаз!"
#         close: false

guis:
  # Пример: Магазин
  shop:
    title: "&6Магазин"
    size: 27
    fill:
      material: GRAY_STAINED_GLASS_PANE
      name: " "
    items:
      # Алмаз
      11:
        material: DIAMOND
        name: "&bАлмаз"
        lore:
          - ""
          - "&7Купить 1 алмаз"
          - "&7Цена: &a100$"
          - ""
        command: "give %player% diamond 1"
        message: "&aВы купили алмаз!"
      
      # Изумруд
      13:
        material: EMERALD
        name: "&aИзумруд"
        lore:
          - ""
          - "&7Купить 1 изумруд"
          - "&7Цена: &a150$"
          - ""
        command: "give %player% emerald 1"
        message: "&aВы купили изумруд!"
      
      # Золото
      15:
        material: GOLD_INGOT
        name: "&6Золото"
        lore:
          - ""
          - "&7Купить 1 золото"
          - "&7Цена: &a50$"
          - ""
        command: "give %player% gold_ingot 1"
        message: "&aВы купили золото!"
      
      # Закрыть
      22:
        material: BARRIER
        name: "&cЗакрыть"
        lore:
          - ""
          - "&7Закрыть меню"
          - ""
        close: true

  # Пример: Инвентарь с информацией
  info:
    title: "&9Информация"
    size: 18
    fill:
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      name: " "
    items:
      4:
        material: PLAYER_HEAD
        name: "&eВаша информация"
        lore:
          - ""
          - "&7Имя: &f%player%"
          - ""
      13:
        material: PAPER
        name: "&aКоманды"
        lore:
          - ""
          - "&e/fly &7- Полёт"
          - "&e/bc &7- Объявление"
          - "&e/shop &7- Магазин"
          - ""
