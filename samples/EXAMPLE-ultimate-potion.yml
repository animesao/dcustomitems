# ============================================
# EXAMPLE: ULTIMATE POTION
# Demonstration of effect sequences
# ============================================

ultimate-potion:
  type: CONSUMABLE
  activation-slot: HAND
  placeable: false
  permission: example.ultimate_potion

  item:
    type: GLASS_BOTTLE
    title: '&6[✨] &fUltimate &6Potion'
    glowing: true
    unbreakable: false
    item-model: "ultimate_potion"
    enchantments:
      MENDING: 1
    item-flags:
      - HIDE_ENCHANTS
    amount: 1

  lore:
    - ''
    - ' &6━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Potion of absolute power'
    - ' &6━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &6✨ &fRight Click: Drink'
    - ' &7Grants ALL combat effects!'
    - ''
    - ' &eSips left: &6%uses% &7of &45'
    - ''

  max-uses: 5
  uses-depleted-message: ""
  cooldown-message: ""
  equip-message: ""
  unequip-message: ""

  click-cooldown: 1000

  triggers:
    on_click_right:
      # Title sequence (animation)
      - 'title_sequence:✨ PREPARATION!|:10:20:10;⚡ POWER!:::10:30:10;🔥 STRENGTH!:::10:40:10;💀 DESTRUCTION!:::10:60:10'
      
      # Effect sequence with delays
      - 'effect_sequence:SPEED:60:3:0;STRENGTH:60:4:500;REGENERATION:60:3:1000;RESISTANCE:60:3:1500;FIRE_RESISTANCE:60:1:2000;NIGHT_VISION:60:1:2500'
      
      # Custom particles (circular aura)
      - 'particles_custom:FLAME:300:0:1:0:3:1:3'
      - 'particles_custom:DRAGON_BREATH:150:0:2:0:2:2:2'
      - 'particles_custom:ENCHANTMENT_TABLE:100:0:3:0:1:1:1'
      
      # Sounds with delays (orchestra)
      - 'sound_sequence:ENTITY_PLAYER_LEVELUP:1:0.8;ENTITY_ORB_PICKUP:1:1;ENTITY_EXPERIENCE_ORB_PICKUP:1:1.2;ENTITY_PLAYER_LEVELUP:1:1.5;ENTITY_ENDER_DRAGON_GROWL:0.5:2'
      
      # Healing
      - 'heal:20'
      
      # Flight
      - 'flight:true'

    on_damage_taken:
      # Automatic healing when damaged
      - 'heal:5'
      - 'effect:REGENERATION:5:3'
      - 'particles_custom:HEART:20:0:2:0:0.5:0.5:0.5'

    on_damage_dealt:
      # Bonus damage
      - 'damage:5'
      - 'particles_custom:CRIT:30:0:1:0:0.5:0.5:0.5'
