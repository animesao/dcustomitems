# ============================================
# NATURE TALISMAN - Single-use item
# ============================================

nature-talisman:
  type: CONSUMABLE
  activation-slot: HAND
  placeable: false
  permission: nature.talisman

  item:
    type: PAPER
    title: '&a[🌿] &fNature &aTalisman'
    glowing: true
    unbreakable: false
    item-model: "nature_talisman"
    amount: 1

  lore:
    - ''
    - ' &2━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Ancient talisman of nature'
    - ' &2━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &a🌿 &fRight Click: Activate'
    - ' &7Grants regeneration for 30 seconds'
    - ''
    - ' &c⚠ Single-use item!'
    - ' &7Uses left: &a%uses%'
    - ''

  max-uses: 1
  uses-depleted-message: ""
  cooldown-message: ""
  equip-message: ""
  unequip-message: ""

  click-cooldown: 500

  triggers:
    on_click_right:
      - 'effect:REGENERATION:30:2'
      - 'heal:10'
      - 'particles:VILLAGER_HAPPY:50'
      - 'sound:ENTITY_PLAYER_LEVELUP:1:1.5'

    on_pickup:
      - 'particles:VILLAGER_HAPPY:10'

    on_drop:
      - 'particles:SMOKE:5'
