# ============================================
# 🛠 CustomCraft — GUI crafting of custom items
# ============================================
# Module: custom crafting through a virtual crafting table.
# Takes the recipes from the `recipes` YAML section of all custom items
# (shaped / shapeless) and lets you craft them in the GUI.
#
# Item identity is based on PDC (PersistentDataContainer / NBT):
#   - custom items are matched by their ID (not by name/material);
#   - ingredients from other plugins are matched by material, their NBT is not spoiled;
#   - the finished item gets the correct uses/duration through ItemHandler.
#
# Disabling: delete the items/customcraft/ folder or set enabled: false.

name: "CustomCraft"
version: "1.0"
enabled: true

# Module command
command: craft

# Permission (empty = no restrictions)
permission: dci.craft

# GUI settings
gui:
  # Window title
  title: "&8\u2692 CustomCraft"
  # Background material
  filler: GRAY_STAINED_GLASS_PANE
  # Result slot (in the 27-slot chest)
  result-slot: 22
  # Return the items from the grid when the window is closed
  return-items-on-close: true

# Messages
messages:
  no-recipes: "&cYou have no available recipes."
  no-permission: "&cYou do not have permission for /craft!"
  crafted: "&aItem crafted!"
  inventory-full: "&cInventory is full!"
