# ============================================
# DeluxeMenuX - Advanced Menu System
# ============================================
name: "DeluxeMenuX"
version: "1.0"
author: "DC-CustomItems"

# Main settings
settings:
  # Message language
  language: "en"
  # Enable sounds
  sounds: true
  # Enable animations
  animations: true

# Module commands
commands:
  - menu
  - deluxemenu
  - kits
  - kit
  - shop

# Permissions
permissions:
  - deluxemenux.use
  - deluxemenux.admin
  - deluxemenux.kit.start
  - deluxemenux.kit.iron
  - deluxemenux.kit.diamond
  - deluxemenux.shop.diamond
  - deluxemenux.shop.emerald
  - deluxemenux.shop.gold
