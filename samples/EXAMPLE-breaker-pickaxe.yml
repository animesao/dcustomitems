# ============================================
# DETONATING PICKAXE - Breaks blocks + haste
# ============================================

breaker-pickaxe:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: pickaxe.breaker

  item:
    type: DIAMOND_PICKAXE
    title: '&a⛏ &fDetonating Pickaxe'
    glowing: true
    unbreakable: true
    item-model: "breaker_pickaxe"
    enchantments:
      EFFICIENCY: 5
      UNBREAKING: 3
      SILK_TOUCH: 1

  lore:
    - ''
    - ' &a━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Pickaxe with a detonating force'
    - ' &a━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &a⛏ &fLeft Click: Break a block'
    - ' &e⚡ &fRight Click: Haste'
    - ''

  click-cooldown: 1000
  cooldown-message: ""
  equip-message: ""
  unequip-message: ""

  triggers:
    on_click_left:
      - 'particles:EXPLOSION_NORMAL:5'
      - 'sound:ENTITY_TNT_PRIMED:0.5:1.5'

    on_click_right:
      - 'effect:SPEED:5:1'
      - 'particles:CRIT:10'
      - 'sound:ENTITY_PLAYER_BURP:0.5:1.2'

    on_equip:
      - 'particles:VILLAGER_HAPPY:15'

    on_unequip:
      - 'particles:SMOKE:10'
