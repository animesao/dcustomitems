# ==========================================
# WEAPONS AND TOOLS
# ==========================================

lightning-staff:
  item:
    type: STICK
    title: '&6⚡ &fLightning Staff'
    glowing: true
    unbreakable: true
  lore:
    - ''
    - ' &7Right Click a block to:'
    - ' &6┌ &eStrike with lightning'
    - ' &6└ &e(Cooldown: 2 sec)'
    - ''
  type: TOOL
  activation-slot: HAND
  placeable: false
  click-cooldown: 2000
  triggers:
    on_click_right:
      - 'lightning:1'
      - 'particle:FIREWORKS_SPARK:10'
      - 'sound:ENTITY_LIGHTNING_BOLT_THUNDER:1:1'
      - 'message:&6⚡ &7Lightning summoned!'
    on_equip:
      - 'particle:PORTAL:10'
      - 'message:&6⚡ &7Staff drawn!'
    on_unequip:
      - 'message:&6⚡ &7Staff sheathed.'

lightning-axe:
  item:
    type: DIAMOND_AXE
    title: '&c⚡ &fStorm Axe'
    glowing: true
    unbreakable: true
    enchantments:
      SHARPNESS: 5
      DURABILITY: 3
  lore:
    - ''
    - ' &7Right Click - 2 lightning bolts'
    - ' &7Left Click - 3 lightning bolts'
    - ''
  type: TOOL
  activation-slot: HAND
  placeable: false
  click-cooldown: 1000
  triggers:
    on_click_right:
      - 'lightning:2'
      - 'particle:FIREWORKS_SPARK:15'
      - 'message:&c⚡ &72 lightning bolts!'
    on_click_left:
      - 'lightning:3'
      - 'particle:EXPLOSION_HUGE:5'
      - 'message:&c💥 &7Lightning explosion!'
    on_equip:
      - 'particle:FIREWORKS_SPARK:10'
      - 'message:&c⚡ &7Axe drawn!'
    on_unequip:
      - 'message:&c⚡ &7Axe sheathed.'

magic-wand:
  item:
    type: BLAZE_ROD
    title: '&5✨ &dMagic Wand'
    glowing: true
    unbreakable: true
  lore:
    - ''
    - ' &7Right Click - Strength'
    - ' &7Left Click - Haste'
    - ''
  type: TOOL
  activation-slot: HAND
  placeable: false
  click-cooldown: 500
  triggers:
    on_click_right:
      - 'effect:INCREASE_DAMAGE:10:2'
      - 'particle:ENCHANTMENT_TABLE:15'
      - 'message:&d✨ Strength activated!'
    on_click_left:
      - 'effect:SPEED:8:2'
      - 'particle:CRIT:10'
      - 'message:&b⚡ Haste activated!'
    on_equip:
      - 'particle:PORTAL:10'
      - 'message:&5✨ &7Wand drawn!'
    on_unequip:
      - 'message:&5✨ &7Wand put away.'

command-staff:
  item:
    type: STICK
    title: '&9📜 &bCommand Staff'
    glowing: true
    unbreakable: true
  lore:
    - ''
    - ' &7Right Click - a diamond'
    - ' &7Uses: &b%uses%'
    - ''
  type: TOOL
  activation-slot: HAND
  placeable: false
  max-uses: 10
  effects:
    - 'NIGHT_VISION:1'
  triggers:
    on_click_right:
      - 'command:give %player% diamond 1'
      - 'particle:VILLAGER_HAPPY:10'
      - 'message:&e+1 diamond!'
    on_equip:
      - 'message:&9📜 &7Staff drawn!'
    on_unequip:
      - 'message:&9📜 &7Staff sheathed.'

