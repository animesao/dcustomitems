# ============================================
# VAMPIRE BLADE - Sword that steals life
# ============================================
# Right Click = Vampire mode (health theft)
# Left Click = AoE damage in an area
# ============================================

vampire-blade:
  type: TOOL
  activation-slot: HAND
  placeable: false
  permission: vampire.blade

  item:
    type: NETHERITE_SWORD
    title: '&4[🦇] &fBlade &4of the Vampire'
    glowing: true
    unbreakable: true
    item-model: "minecraft:item/smoke"
    enchantments:
      SHARPNESS: 5
      UNBREAKING: 3
      SWEEPING_EDGE: 3

  lore:
    - ''
    - ' &4━━━━━━━━━━━━━━━━━━━━━━━━'
    - ' &7Ancient blade of the vampires'
    - ' &4━━━━━━━━━━━━━━━━━━━━━━━━'
    - ''
    - ' &e⚡ &fWhile in main hand:'
    - ' &6┌ &eStrength &4III'
    - ' &6├ &eSpeed &4I'
    - ' &6└ &eRegeneration &4II'
    - ''
    - '&c❤ &fRight Click: Blood mode'
    - '&4💀 &fLeft Click: AoE strike!'
    - ''

  effects:
    - 'INCREASE_DAMAGE:3'
    - 'SPEED:1'
    - 'REGENERATION:2'

  attributes:
    GENERIC_ATTACK_DAMAGE: 10.0
    GENERIC_ATTACK_SPEED: 1.6
    GENERIC_MAX_HEALTH: 4.0

  click-cooldown: 2000
  cooldown-message: ""

  triggers:
    on_equip:
      - 'particles:DRAGON_BREATH:20'
      - 'particles:DUST:25'
      - 'particles:WITCH:15'
      - 'sound:ENTITY_WITHER_AMBIENT:1:1.2'
      - 'message:&4👁 &7You feel a thirst for blood!'

    on_unequip:
      - 'particles:SMOKE:15'
      - 'particles:CLOUD:10'
      - 'sound:ENTITY_ENDER_DRAGON_GROWL:0.5:1.5'

    on_click_right:
      - 'effect:STRENGTH:8:2'
      - 'effect:REGENERATION:10:3'
      - 'effect:SPEED:10:2'
      - 'particles:DRAGON_BREATH:30'
      - 'particles:DUST:20'
      - 'sound:ENTITY_VAMPIRE_BITE:1:1'
      - 'title:&4🦇 &7BLOOD MODE!|&cHealth theft is active!:10:40:10'

    on_click_left:
      - 'damage_nearby:20:4'
      - 'effect:STRENGTH:8:4'
      - 'effect:SPEED:8:3'
      - 'particles:DRAGON_BREATH:50'
      - 'particles:DUST:40'
      - 'particles:WITCH:30'
      - 'sound:ENTITY_ENDER_DRAGON_GROWL:1:1'
      - 'knockback:4'
      - 'title:&4💀 &7VAMPIRE AoE STRIKE!|&4All enemies are hit!:10:40:10'

    on_kill:
      - 'heal:40'
      - 'effect:REGENERATION:15:3'
      - 'effect:STRENGTH:8:3'
      - 'effect:SPEED:8:2'
      - 'particles:HEART:30'
      - 'sound:ENTITY_PLAYER_LEVELUP:1:2'

    on_damage_dealt:
      - 'heal:6'
      - 'particles:DRAGON_BREATH:12'
      - 'sound:ENTITY_VAMPIRE_BITE:0.5:2'

    on_jump:
      - 'effect:SPEED:3:1'
      - 'particles:SMOKE:8'

    on_damage_taken:
      - 'effect:REGENERATION:5:2'
      - 'particles:DUST:10'

    on_pickup:
      - 'particles:DRAGON_BREATH:25'

    on_drop:
      - 'particles:SMOKE:20'
