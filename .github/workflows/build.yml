name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build with Maven
      run: mvn clean package -q

    - name: Get version
      id: version
      run: |
        VERSION=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/' | tr -d ' ')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 Version: $VERSION"

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: DC-CustomItems-${{ steps.version.outputs.version }}
        path: target/DC-CustomItems-${{ steps.version.outputs.version }}.jar
        retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download JAR
      uses: actions/download-artifact@v4
      with:
        name: DC-CustomItems-${{ steps.version.outputs.version }}

    - name: Generate release notes
      run: |
        # Get previous tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

        echo "## 🚀 DC-CustomItems ${{ github.ref_name }}" > notes.md
        echo "" >> notes.md

        if [ -n "$PREV_TAG" ]; then
          echo "### 📝 What's Changed since $PREV_TAG" >> notes.md
          echo "" >> notes.md
          git log --oneline ${PREV_TAG}..HEAD --pretty=format:"- %s" >> notes.md
        else
          echo "### 📝 Initial Release" >> notes.md
          echo "" >> notes.md
          git log --oneline -20 --pretty=format:"- %s" >> notes.md
        fi

        echo "" >> notes.md
        echo "" >> notes.md
        echo "---" >> notes.md
        echo "" >> notes.md
        echo "### 📦 Installation" >> notes.md
        echo "1. Download \`DC-CustomItems-${{ steps.version.outputs.version }}.jar\` from Assets" >> notes.md
        echo "2. Place in your server's \`plugins/\` folder" >> notes.md
        echo "3. Restart the server" >> notes.md
        echo "" >> notes.md
        echo "### 📚 Documentation" >> notes.md
        echo "- [README](https://github.com/animesao/dcustomitems#readme)" >> notes.md
        echo "- [Full Documentation](https://github.com/animesao/dcustomitems/tree/main/docs)" >> notes.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: "DC-CustomItems ${{ github.ref_name }}"
        body_path: notes.md
        files: DC-CustomItems-${{ steps.version.outputs.version }}.jar
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
