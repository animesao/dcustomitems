name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -q

    - name: Get version
      id: version
      run: |
        VERSION=$(grep -oP '<version>\K[^<]+' pom.xml | head -1)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Find JAR file
      id: jar
      run: |
        JAR=$(find target -name "*-shaded.jar" | head -1)
        echo "path=$JAR" >> $GITHUB_OUTPUT
        echo "Found JAR: $JAR"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dcustomitems-${{ steps.version.outputs.version }}
        path: ${{ steps.jar.outputs.path }}
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: "DC-CustomItems v${{ steps.version.outputs.version }}"
        files: ${{ steps.jar.outputs.path }}
        generate_release_notes: true
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
